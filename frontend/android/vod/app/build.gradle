// CharmIPTV: build the unmodified VOD feature code as a library in the host APK.
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'androidx.navigation.safeargs.kotlin'
apply plugin: 'kotlin-parcelize'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

def vodProperties = new Properties()
def localConfig = rootProject.file('vod.properties')
if (localConfig.exists()) localConfig.withInputStream { vodProperties.load(it) }
def setting = { String key -> System.getenv(key) ?: vodProperties.getProperty(key, '') }
def quote = { String value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }

android {
    namespace 'com.streamflixreborn.streamflix'
    compileSdk 36
    ndkVersion rootProject.ext.ndkVersion
    defaultConfig {
        minSdk 24
        buildConfigField 'String', 'APPLICATION_ID', '"com.charmiptv.app.purple.next.vodtest1"'
        buildConfigField 'int', 'VERSION_CODE', '8'
        buildConfigField 'String', 'VERSION_NAME', '"2.1.0-rc.5-vod-test-1"'
        buildConfigField 'String', 'APP_LAYOUT', '"tv"'
        buildConfigField 'boolean', 'CHARM_VOD_EMBEDDED', 'true'
        ['TMDB_API_KEY', 'SUBDL_API_KEY', 'RABBITSTREAM_SOURCE_API'].each { key ->
            buildConfigField 'String', key, quote(setting(key))
        }
        externalNativeBuild { cmake { cppFlags '-std=c++17' } }
    }
    buildTypes {
        sideload {
            initWith release
            matchingFallbacks = ['release']
            buildConfigField 'String', 'APPLICATION_ID', '"com.charmiptv.app.purple.next.vodtest1.sideload"'
        }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    sourceSets.main.manifest.srcFile 'src/main/embedded/AndroidManifest.xml'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { viewBinding true; buildConfig true }
}

def generateVodKeys = tasks.register('generateVodKeys') {
    def template = file('src/main/cpp/native-lib.cpp.template')
    def output = file('src/main/cpp/native-lib.cpp')
    inputs.file(template)
    ['UPROT_MSFI_API_BASE', 'UPROT_MSE_API_BASE', 'UPROT_API_KEY'].each { key -> inputs.property(key, setting(key)) }
    outputs.file(output)
    doLast {
        def content = template.getText('UTF-8')
        ['UPROT_MSFI_API_BASE', 'UPROT_MSE_API_BASE', 'UPROT_API_KEY'].each { key ->
            content = content.replace('{{' + key + '}}', setting(key).replace('\\', '\\\\').replace('"', '\\"'))
        }
        output.setText(content, 'UTF-8')
    }
}
tasks.configureEach { if (name.startsWith('configureCMake') || name == 'preBuild') dependsOn(generateVodKeys) }

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation 'androidx.media3:media3-datasource-okhttp:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.8'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.8'
    implementation project(path: ':vod-navigation')

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.leanback:leanback:1.2.0'
    implementation 'com.github.bumptech.glide:glide:5.0.0-rc01'
    implementation 'androidx.work:work-runtime-ktx:2.10.0'
    implementation 'com.github.bumptech.glide:okhttp3-integration:5.0.0-rc01'
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation 'org.chromium.net:cronet-embedded:119.6045.31'

    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-dash:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'androidx.media3:media3-session:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'dnsjava:dnsjava:3.6.3'
    implementation project(path: ':vod-jsoup')
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.11.0'
    implementation 'org.jsoup:jsoup:1.19.1'

    implementation 'androidx.fragment:fragment-ktx:1.8.6'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.leanback:leanback-preference:1.2.0'

    implementation 'androidx.tvprovider:tvprovider:1.1.0'

    implementation "androidx.room:room-runtime:2.7.0-rc01"
    implementation "androidx.room:room-ktx:2.7.0-rc01"
    implementation 'com.google.android.material:material:1.12.0'
    ksp 'androidx.room:room-compiler:2.7.0-rc01'

    implementation("org.mozilla:rhino:1.8.0")
    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.0")
    implementation platform("io.github.jan-tennert.supabase:bom:3.2.2")
    implementation "io.github.jan-tennert.supabase:auth-kt"
    implementation "io.github.jan-tennert.supabase:postgrest-kt"
    implementation "io.github.jan-tennert.supabase:realtime-kt"
    implementation "io.ktor:ktor-client-okhttp:3.2.2"
    testImplementation "junit:junit:4.13.2"
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    implementation "androidx.browser:browser:1.7.0"
    implementation "org.nanohttpd:nanohttpd:2.3.1"
    implementation "com.google.zxing:core:3.5.1"
    implementation("org.java-websocket:Java-WebSocket:1.5.3")
    
}

