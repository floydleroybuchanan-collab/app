apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.kapt"
apply plugin: "com.facebook.react"

kapt {
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas")
        arg("room.incremental", "true")
    }
}

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    def reactNativePackageDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile()
    hermesCommand = new File(reactNativePackageDir, "sdks/hermesc/%OS-BIN%/hermesc").getAbsolutePath()
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()
    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the React Native package lives.
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where React Native Codegen lives.
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    // nodeExecutableAndArgs = ["node"]
    // bundleConfig = file(../rn-cli.config.js)
    // bundleAssetName = "MyApplication.android.bundle"
    // entryFile = file("../rn-cli.config.js")
    // extraPackagerArgs = []

    /* Hermes Commands */
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true in release builds to optimize the app using R8.
 */
def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: false).toBoolean()

/**
 * Preferred JavaScriptCore flavor when Hermes is disabled.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.0.0'

def releaseSigning = [
    storeFile: System.getenv("CHARM_UPLOAD_STORE_FILE") ?: findProperty("CHARM_UPLOAD_STORE_FILE"),
    storePassword: System.getenv("CHARM_UPLOAD_STORE_PASSWORD") ?: findProperty("CHARM_UPLOAD_STORE_PASSWORD"),
    keyAlias: System.getenv("CHARM_UPLOAD_KEY_ALIAS") ?: findProperty("CHARM_UPLOAD_KEY_ALIAS"),
    keyPassword: System.getenv("CHARM_UPLOAD_KEY_PASSWORD") ?: findProperty("CHARM_UPLOAD_KEY_PASSWORD"),
]
def releaseSigningConfigured = releaseSigning.values().every { it != null && it.toString().trim() }
def releaseTaskRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }

if (releaseTaskRequested && !releaseSigningConfigured) {
    throw new GradleException(
        "Release signing is required. Configure CHARM_UPLOAD_STORE_FILE, " +
        "CHARM_UPLOAD_STORE_PASSWORD, CHARM_UPLOAD_KEY_ALIAS, and CHARM_UPLOAD_KEY_PASSWORD. " +
        "Use assembleSideload for a standalone tester APK."
    )
}

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    // Keep the Java/Kotlin namespace aligned with the existing native source
    // package, but give Purple TV a distinct application ID so it can be
    // installed beside stable/perf builds without replacing their app data.
    namespace 'com.charmiptv.app'
    defaultConfig {
        applicationId 'com.charmiptv.app.purple.next'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 8
        versionName "2.1.0-rc.5"
        manifestPlaceholders = [allowCleartextStreams: "false"]

        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            manifestPlaceholders.allowCleartextStreams = "true"
        }
        release {
            if (releaseSigningConfigured) signingConfig signingConfigs.release
            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'
            shrinkResources enableShrinkResources.toBoolean()
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            def enablePngCrunch = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs enablePngCrunch.toBoolean()
        }
        // Standalone tester builds embed the release JS bundle but are clearly
        // separated from production signing and installation identity.
        sideload {
            initWith release
            matchingFallbacks = ['release']
            signingConfig signingConfigs.debug
            applicationIdSuffix '.sideload'
            versionNameSuffix '-sideload'
            // Tester/provider builds retain explicit legacy HTTP compatibility;
            // production release builds stay HTTPS-only by default.
            manifestPlaceholders.allowCleartextStreams = "true"
        }
    }
    packagingOptions {
        jniLibs {
            // Do not name this local variable `useLegacyPackaging`: that shadows
            // the AGP DSL setter and causes Groovy to try calling a String.
            def legacyPackagingEnabled = (findProperty('expo.useLegacyPackaging') ?: 'false').toBoolean()
            useLegacyPackaging legacyPackagingEnabled
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    for (i in 0..<options.size()) options[i] = options[i].trim();
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("androidx.room:room-runtime:2.7.2")
    implementation("androidx.room:room-ktx:2.7.2")
    kapt("androidx.room:room-compiler:2.7.2")
    implementation("androidx.work:work-runtime-ktx:2.10.2")
    implementation("com.github.bumptech.glide:glide:4.16.0")
    // LGPL-only Media3 FFmpeg audio extension built from pinned source in CI.
    // DefaultRenderersFactory in the Expo Video patch discovers it reflectively.
    implementation project(':ffmpeg-audio')

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        implementation("com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        implementation("com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            implementation("com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
