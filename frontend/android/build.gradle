// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.10')
    classpath('org.jetbrains.kotlin:kotlin-serialization:2.2.10')
    classpath('com.google.devtools.ksp:symbol-processing-gradle-plugin:2.2.10-2.0.2')
    classpath('androidx.navigation:navigation-safe-args-gradle-plugin:2.8.8')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// The host generates the single Glide app module after seeing both libraries.
// Expo explicitly supports this opt-out for applications supplying their own module.
ext.excludeAppGlideModule = true

subprojects { subproject ->
  // Opt-in compatibility gate: check native API availability at the declared
  // minimum OS without turning unrelated upstream style warnings into blockers.
  ['com.android.application', 'com.android.library'].each { pluginId ->
    subproject.plugins.withId(pluginId) {
      if (rootProject.hasProperty('charm.compatibilityAudit')) {
        subproject.android.lint {
          checkOnly += ['NewApi', 'InlinedApi']
          abortOnError true
          textReport true
        }
      }
    }
  }
  if (subproject.name == 'expo-image') {
    subproject.plugins.withId('org.jetbrains.kotlin.android') {
      // Expo's Java-source exclusion does not exclude Kotlin sources on Kotlin 2.2.
      subproject.kotlin.sourceSets.configureEach {
        kotlin.exclude('**/ExpoImageAppGlideModule.kt')
      }
      // Kotlin's Android compilation also adds the Java directories directly.
      subproject.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        exclude('**/ExpoImageAppGlideModule.kt')
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
