plugins {
    id 'com.android.library'
}

android {
    namespace 'androidx.media3.decoder.ffmpeg'
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        consumerProguardFiles 'proguard-rules.pro'
    }

    def ffmpegLibs = file('src/main/jni/ffmpeg/android-libs')
    def packagesApk = gradle.startParameter.taskNames.any {
        def task = it.toLowerCase()
        (task.contains('assemble') || task.contains('bundle') || task.contains('package')) &&
            (task.contains('release') || task.contains('sideload'))
    }
    if (ffmpegLibs.exists()) {
        externalNativeBuild {
            cmake {
                path file('src/main/jni/CMakeLists.txt')
                version '3.22.1'
            }
        }
    } else if (System.getenv('CI') == '1' && packagesApk) {
        throw new GradleException(
            "FFmpeg android-libs missing under ffmpeg-audio. " +
            "Run scripts/build-media3-ffmpeg-audio.sh before packaging an APK in CI."
        )
    } else {
        logger.warn(
            "ffmpeg-audio: native libs missing; Media3 will not decode AC-3/E-AC-3/DTS " +
            "until scripts/build-media3-ffmpeg-audio.sh is run."
        )
    }
}

dependencies {
    // API exposure is intentional: Charm's Activity-owned player core compiles
    // against the exact same pinned Media3 graph as the FFmpeg extension.
    api 'androidx.media3:media3-exoplayer:1.8.0'
    api 'androidx.media3:media3-ui:1.8.0'
    api 'androidx.media3:media3-datasource-okhttp:1.8.0'
    api 'androidx.media3:media3-decoder:1.8.0'
    implementation 'androidx.annotation:annotation:1.9.1'
}
