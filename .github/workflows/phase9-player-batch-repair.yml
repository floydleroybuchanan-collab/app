name: Apply Phase 9 Player Batch Repair

on:
  push:
    branches:
      - agent/phase9-tivimate-scan-repair

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/phase9-tivimate-scan-repair
          fetch-depth: 0
      - name: Apply clean-room player repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          player = Path('frontend/app/player.tsx')
          s = player.read_text()

          # 1) Channel strip selection owns playback until the route truly changes.
          anchor = '  const channelIdRef = useRef(params.channelId);\n'
          if 'lastRouteChannelIdRef' not in s:
              if anchor not in s: raise SystemExit('channelIdRef anchor missing')
              s = s.replace(anchor, anchor + '  // Route ownership is edge-triggered: once fullscreen is mounted, in-player channel\n  // selection owns playback until the router actually supplies a different channel id.\n  const lastRouteChannelIdRef = useRef(params.channelId);\n', 1)
          old_route = '''  useEffect(() => {\n    if (!params.channelId || params.channelId === channelIdRef.current) return;\n    changeChannel(params.channelId, false, { immediate: true });\n  }, [changeChannel, params.channelId]);\n'''
          new_route = '''  useEffect(() => {\n    const routeChannelId = String(params.channelId || "").trim();\n    // Do not let rerenders make the original fullscreen route reclaim a channel\n    // selected from the live Channels strip. Only a new route value may retune.\n    if (!routeChannelId || routeChannelId === lastRouteChannelIdRef.current) return;\n    lastRouteChannelIdRef.current = routeChannelId;\n    if (routeChannelId === channelIdRef.current) return;\n    changeChannel(routeChannelId, false, { immediate: true });\n  }, [changeChannel, params.channelId]);\n'''
          if old_route in s:
              s = s.replace(old_route, new_route, 1)
          elif new_route not in s:
              raise SystemExit('route sync anchor missing')

          # 2) More overlay must claim focus and remain scroll-reachable.
          if '  ScrollView,\n' not in s:
              s = s.replace('  FlatList,\n  Platform,', '  FlatList,\n  Platform,\n  ScrollView,', 1)
          more_anchor = '  const moreButtonRef = useRef<any>(null);\n'
          if 'moreFirstActionRef' not in s:
              if more_anchor not in s: raise SystemExit('moreButtonRef anchor missing')
              s = s.replace(more_anchor, more_anchor + '  const moreFirstActionRef = useRef<any>(null);\n', 1)
          close_anchor = '''  const closeOverlayAndRestoreFocus = useCallback(() => {\n    setPlayerOverlay(null);\n    const opener = overlayOpenerRef.current;\n    overlayOpenerRef.current = null;\n    if (opener) requestAnimationFrame(() => requestNativeFocus(opener));\n  }, []);\n'''
          if 'requestNativeFocus(moreFirstActionRef.current)' not in s:
              if close_anchor not in s: raise SystemExit('closeOverlay anchor missing')
              s = s.replace(close_anchor, close_anchor + '''\n  useEffect(() => {\n    if (!moreOpen || !isTV) return;\n    // Once More is visible it becomes the native TV focus owner.\n    const frame = requestAnimationFrame(() => requestNativeFocus(moreFirstActionRef.current));\n    return () => cancelAnimationFrame(frame);\n  }, [isTV, moreOpen]);\n''', 1)
          old_more = '''            {moreOpen ? (\n              <View style={styles.tracksPanel}>\n                <Pressable onPress={returnToPreviousChannel} style={({ focused }: any) => [styles.trackRow, focused && styles.focused]}>\n                  <Ionicons name="return-up-back-outline" size={15} color="#fff" />\n                  <Text style={styles.controlLabel}>Previous channel</Text>\n                </Pressable>\n'''
          new_more = '''            {moreOpen ? (\n              <ScrollView\n                style={styles.morePanel}\n                contentContainerStyle={styles.morePanelContent}\n                showsVerticalScrollIndicator={false}\n                nestedScrollEnabled\n              >\n                <Pressable\n                  ref={moreFirstActionRef}\n                  hasTVPreferredFocus\n                  onPress={returnToPreviousChannel}\n                  style={({ focused }: any) => [styles.trackRow, focused && styles.focused]}\n                >\n                  <Ionicons name="return-up-back-outline" size={15} color="#fff" />\n                  <Text style={styles.controlLabel}>Previous channel</Text>\n                </Pressable>\n'''
          if old_more in s:
              s = s.replace(old_more, new_more, 1)
          elif '<ScrollView\n                style={styles.morePanel}' not in s:
              raise SystemExit('More panel open anchor missing')
          old_more_close = '''                <Pressable onPress={() => void saveAudioReport()} style={({ focused }: any) => [styles.trackRow, focused && styles.focused]} testID="player-report-audio">\n                  <Ionicons name="bug-outline" size={15} color="#fff" />\n                  <Text style={styles.controlLabel}>Diagnostics</Text>\n                </Pressable>\n              </View>\n            ) : null}\n\n            {tracksOpen ? (\n'''
          new_more_close = old_more_close.replace('              </View>\n            ) : null}', '              </ScrollView>\n            ) : null}')
          if old_more_close in s:
              s = s.replace(old_more_close, new_more_close, 1)
          elif '</ScrollView>\n            ) : null}\n\n            {tracksOpen ? (' not in s:
              raise SystemExit('More panel close anchor missing')
          style_anchor = '  tracksPanel: { maxHeight: 160, marginTop: 6, padding: 8, borderRadius: radius.sm, backgroundColor: "rgba(16,16,30,0.94)", gap: 4 },\n'
          if '  morePanel:' not in s:
              if style_anchor not in s: raise SystemExit('tracksPanel style anchor missing')
              s = s.replace(style_anchor, style_anchor + '  morePanel: { maxHeight: 190, marginTop: 6, borderRadius: radius.sm, backgroundColor: "rgba(16,16,30,0.94)" },\n  morePanelContent: { padding: 8, gap: 4 },\n', 1)
          player.write_text(s)

          # 3) Only a real post-playback loading/buffering state may arm Media3 recovery.
          stream = Path('frontend/src/components/StreamPlayer.tsx')
          v = stream.read_text()
          old_watch = '''      const now = Date.now();\n      const bufferingSince = bufferingSinceRef.current;\n      const stalledReady =\n        bufferingSince == null &&\n        hasAdvancedPlaybackRef.current &&\n        now - lastPlaybackAdvanceAtRef.current >= BUFFERING_RESYNC_MS;\n      if (bufferingSince == null && !stalledReady) return;\n      const bufferingFor = bufferingSince != null\n        ? now - bufferingSince\n        : now - lastPlaybackAdvanceAtRef.current;\n      if (bufferingFor < BUFFERING_RESYNC_MS) return;\n'''
          new_watch = '''      const now = Date.now();\n      const bufferingSince = bufferingSinceRef.current;\n      // Live IPTV clocks can briefly pause or report sparse time updates while\n      // still healthy. Only Media3's explicit post-playback loading state owns\n      // rebuffer recovery; synthetic ready-state stalls caused periodic reloads.\n      if (bufferingSince == null) return;\n      const bufferingFor = now - bufferingSince;\n      if (bufferingFor < BUFFERING_RESYNC_MS) return;\n'''
          if old_watch in v:
              v = v.replace(old_watch, new_watch, 1)
          elif 'const stalledReady =' not in v and 'const bufferingFor = now - bufferingSince;' in v:
              pass
          else:
              raise SystemExit('Media3 watchdog anchor missing')
          stream.write_text(v)

          tests = Path('frontend/tests/playerAndFocus.test.mjs')
          t = tests.read_text()
          blocks = [r'''

test("player Channels strip owns playback until the route actually changes", async () => {
  const player = await source("app/player.tsx");
  assert.match(player, /const lastRouteChannelIdRef = useRef\(params\.channelId\)/);
  assert.match(player, /routeChannelId === lastRouteChannelIdRef\.current/);
  assert.match(player, /lastRouteChannelIdRef\.current = routeChannelId/);
  assert.match(player, /changeChannel\(routeChannelId, false, \{ immediate: true \}\)/);
});
''', r'''

test("player More overlay claims visible focus and keeps every action scroll-reachable", async () => {
  const player = await source("app/player.tsx");
  assert.match(player, /const moreFirstActionRef = useRef<any>\(null\)/);
  assert.match(player, /requestNativeFocus\(moreFirstActionRef\.current\)/);
  assert.match(player, /ref=\{moreFirstActionRef\}/);
  assert.match(player, /style=\{styles\.morePanel\}/);
  assert.match(player, /contentContainerStyle=\{styles\.morePanelContent\}/);
});
''', r'''

test("fullscreen Media3 recovery only arms from a real buffering state", async () => {
  const player = await source("src/components/StreamPlayer.tsx");
  assert.match(player, /if \(bufferingSince == null\) return/);
  assert.match(player, /const bufferingFor = now - bufferingSince/);
  assert.doesNotMatch(player, /const stalledReady =/);
  assert.match(player, /const BUFFERING_RESYNC_MS = 5000/);
  assert.match(player, /const BUFFERING_FAIL_MS = 22000/);
});
''']
          names = [
              'player Channels strip owns playback until the route actually changes',
              'player More overlay claims visible focus and keeps every action scroll-reachable',
              'fullscreen Media3 recovery only arms from a real buffering state',
          ]
          for name, block in zip(names, blocks):
              if name not in t:
                  t = t.rstrip() + block + '\n'
          tests.write_text(t)
          PY
      - name: Run targeted regressions
        working-directory: frontend
        run: node --experimental-strip-types tests/playerAndFocus.test.mjs
      - name: Commit combined player repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/player.tsx frontend/src/components/StreamPlayer.tsx frontend/tests/playerAndFocus.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix(player): stabilize channel switching focus and rebuffering"
          git push origin HEAD:agent/phase9-tivimate-scan-repair
