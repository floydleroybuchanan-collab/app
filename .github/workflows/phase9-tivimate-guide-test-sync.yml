name: Phase 9 TiviMate Guide Ownership Test Sync

on:
  push:
    branches:
      - phase9/purple-next
    paths:
      - ".github/workflows/phase9-tivimate-guide-test-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase9/purple-next
      - name: Update stale focus-ownership regression assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          test = Path('frontend/tests/guideShellPolish.test.mjs')
          t = test.read_text()
          old = '''  assert.match(native, /if \\(!value\\) removeCallbacks\\(settleSelectionRunnable\\)/);'''
          new = '''  assert.match(native, /if \\(!value\\) \\{[\\s\\S]{0,180}removeCallbacks\\(settleSelectionRunnable\\)[\\s\\S]{0,120}navigationKeyDown = false[\\s\\S]{0,120}moveVelocity = 0/);'''
          if old in t:
              t = t.replace(old, new, 1)
          elif new not in t:
              raise SystemExit('stale focus ownership assertion marker not found')
          test.write_text(t)
          PY
      - name: Commit Guide test synchronization
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/tests/guideShellPolish.test.mjs
          git commit -m "phase9: sync guide focus ownership regression test"
          git push origin HEAD:phase9/purple-next