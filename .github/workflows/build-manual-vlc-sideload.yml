name: Build Validated Media3 + VLC Sideload APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent/manual-vlc-engine-build
    paths:
      - ".github/manual-vlc-build-trigger"
      - ".github/workflows/build-manual-vlc-sideload.yml"

permissions:
  contents: write

concurrency:
  group: manual-vlc-sideload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build validated universal sideload APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "1"
      CMAKE_BUILD_PARALLEL_LEVEL: "1"
      BUILD_LABEL: "69"
      EXPO_PUBLIC_M3U_URL: ${{ secrets.M3U_URL || vars.EXPO_PUBLIC_M3U_URL }}
      EXPO_PUBLIC_EPG_URL: ${{ secrets.EPG_URL || vars.EXPO_PUBLIC_EPG_URL }}
      EXPO_PUBLIC_GUIDE_WINDOW_HOURS: ${{ vars.EXPO_PUBLIC_GUIDE_WINDOW_HOURS || '24' }}

    steps:
      - name: Checkout exact build head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Publish build run id
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$GITHUB_RUN_ID" > .github/manual-vlc-build-current-run.txt
          git add .github/manual-vlc-build-current-run.txt
          git commit -m "ci: record Media3 VLC sideload run ${GITHUB_RUN_ID}" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android SDK and pinned NDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Verify locked provider sources
        run: |
          test -n "${EXPO_PUBLIC_M3U_URL}"
          test -n "${EXPO_PUBLIC_EPG_URL}"

      - name: Verify native architecture and config
        run: |
          npm run verify:native-guide
          npm run verify:native-config

      - name: Unit and wiring tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Whole-repository player interaction scan
        working-directory: .
        run: python3 ci/tivimate-whole-repo-player-interaction-scan.py

      - name: Verify validated source and engine invariants
        working-directory: .
        run: |
          test "$(git merge-base HEAD 47c9a06ce0fdf89585333aa54ad2860a366120a3)" = "47c9a06ce0fdf89585333aa54ad2860a366120a3"
          PLAYER=frontend/android/app/src/main/java/com/charmiptv/app/NativePlaybackManager.kt
          test -f frontend/android/app/src/main/java/com/charmiptv/app/NativeVlcPlaybackManager.kt
          test -f frontend/android/app/src/main/java/com/charmiptv/app/NativeVlcPlaybackModule.kt
          grep -q 'org.videolan.android:libvlc-all' frontend/android/app/build.gradle
          grep -q 'OPAQUE_LIVE_CANDIDATES = listOf("transport", "hls", "dash", "progressive")' "$PLAYER"
          ! grep -q 'NativeOpaqueStreamProbe.start' "$PLAYER"
          grep -q 'MIN_BUFFER_MS_LOW_RAM = 10_000' "$PLAYER"
          grep -q 'MAX_BUFFER_MS_LOW_RAM = 30_000' "$PLAYER"
          grep -q 'PLAYBACK_BUFFER_MS_LOW_RAM = 2_500' "$PLAYER"
          grep -q 'REBUFFER_BUFFER_MS_LOW_RAM = 5_000' "$PLAYER"
          grep -q 'MIN_BUFFER_MS_NORMAL = 15_000' "$PLAYER"
          grep -q 'MAX_BUFFER_MS_NORMAL = 60_000' "$PLAYER"
          grep -q 'PLAYBACK_BUFFER_MS_NORMAL = 3_000' "$PLAYER"
          grep -q 'REBUFFER_BUFFER_MS_NORMAL = 5_000' "$PLAYER"
          grep -q 'readTimeout(20, TimeUnit.SECONDS)' "$PLAYER"
          grep -q 'MAX_AUTO_RECOVERIES = 4' "$PLAYER"
          grep -q 'longArrayOf(0L, 1_000L, 3_000L, 6_000L)' "$PLAYER"

      - name: Build pinned LGPL FFmpeg audio extension
        run: |
          chmod +x scripts/build-media3-ffmpeg-audio.sh
          ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/27.1.12297006" ./scripts/build-media3-ffmpeg-audio.sh

      - name: Configure deterministic low-memory build
        run: |
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.workers.max=1
          org.gradle.vfs.watch=false
          kotlin.compiler.execution.strategy=in-process
          kotlin.daemon.enabled=false
          reactNativeArchitectures=armeabi-v7a,arm64-v8a
          EOF

      - name: Compile sideload Kotlin and Java
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android :app:compileSideloadKotlin :app:compileSideloadJavaWithJavac --no-daemon --max-workers=1 --stacktrace

      - name: Build universal sideload APK
        run: ./android/gradlew -p android :app:assembleSideload --no-daemon --max-workers=1 --stacktrace

      - name: Verify packaged Media3 VLC APK and checksum
        run: |
          APK="android/app/build/outputs/apk/sideload/app-sideload.apk"
          test -f "$APK"
          unzip -l "$APK" > apk-contents.txt
          grep -Eq 'assets/index.android.bundle|assets/.*\.bundle' apk-contents.txt
          grep -q 'lib/armeabi-v7a/' apk-contents.txt
          grep -q 'lib/arm64-v8a/' apk-contents.txt
          grep -Eq 'libffmpeg|ffmpeg' apk-contents.txt
          grep -Eq 'libvlc|libvlcjni|libvlcjni\.so|libvlc\.so' apk-contents.txt
          mkdir -p artifacts
          OUT="artifacts/CharmIPTV-Media3-VLC-Sideload-${BUILD_LABEL}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > artifacts/SHA256SUMS.txt
          printf 'validated_code=47c9a06ce0fdf89585333aa54ad2860a366120a3\nbuild_head=%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > artifacts/BUILD_INFO.txt

      - name: Upload combined sideload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CharmIPTV-Media3-VLC-Sideload-69
          path: |
            frontend/artifacts/CharmIPTV-Media3-VLC-Sideload-69.apk
            frontend/artifacts/SHA256SUMS.txt
            frontend/artifacts/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
