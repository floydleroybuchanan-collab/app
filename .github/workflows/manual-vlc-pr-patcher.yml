name: Manual VLC PR Patch Gate

on:
  pull_request:
    branches:
      - agent/media3-validation-base-no-apk
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-js-validate:
    if: github.head_ref == 'agent/manual-vlc-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout VLC branch
        uses: actions/checkout@v4
        with:
          ref: agent/manual-vlc-engine
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply atomic VLC/profile patch
        run: python3 .github/apply_manual_vlc_patch.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Unit and wiring tests
        working-directory: frontend
        run: npm test

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Commit validated wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          if git diff --cached --quiet; then
            echo "No wiring changes to commit"
            exit 0
          fi
          git commit -m "feat(player): wire manual VLC engine and playback profiles"
          git push origin HEAD:agent/manual-vlc-engine
