name: Phase 9 Home EPG Ownership Focus

on:
  push:
    branches:
      - phase9/purple-next
    paths:
      - "ci/phase9-home-epg-ownership-focus.trigger"
      - "ci/phase9-home-epg-ownership-focus.py"
      - ".github/workflows/phase9-home-epg-ownership-focus.yml"

permissions:
  contents: write

concurrency:
  group: phase9-home-epg-ownership-focus
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase9/purple-next
      - name: Apply guarded Live TV ownership repair
        run: python ci/phase9-home-epg-ownership-focus.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'frontend/app/(tabs)/index.tsx'
          git commit -m "Phase 9: keep Live TV programme data ownership-aware" || exit 0
          git pull --rebase origin phase9/purple-next
          git push origin HEAD:phase9/purple-next
