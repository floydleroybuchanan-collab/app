name: Phase 9 TiviMate Startup Refresh Deferral

on:
  push:
    branches:
      - phase9/purple-next
    paths:
      - ".github/workflows/phase9-tivimate-startup-refresh-deferral.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase9/purple-next
      - name: Defer automatic playlist and EPG due-check after boot
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/source.native.ts')
          s = p.read_text()
          marker = 'let lastSourceError: string | null = null;\n'
          add = marker + '''let startupRefreshTimer: ReturnType<typeof setTimeout> | null = null;\nconst STARTUP_SOURCE_REFRESH_DELAY_MS = 30_000;\n\nfunction scheduleStartupSourceRefresh(): void {\n  if (startupRefreshTimer) return;\n  startupRefreshTimer = setTimeout(() => {\n    startupRefreshTimer = null;\n    void refreshSourcesIfDue().catch(() => undefined);\n  }, STARTUP_SOURCE_REFRESH_DELAY_MS);\n}\n'''
          if 'STARTUP_SOURCE_REFRESH_DELAY_MS' not in s:
              if marker not in s: raise SystemExit('startup state marker not found')
              s = s.replace(marker, add, 1)
          old = '    void refreshSourcesIfDue();\n    return cached;\n'
          new = '    scheduleStartupSourceRefresh();\n    return cached;\n'
          if old in s:
              s = s.replace(old, new, 1)
          elif 'scheduleStartupSourceRefresh();\n    return cached;' not in s:
              raise SystemExit('startup refresh caller marker not found')
          p.write_text(s)
          PY
      - name: Commit startup deferral
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/source.native.ts
          git commit -m "phase9: defer automatic source refresh after cold start"
          git push origin HEAD:phase9/purple-next
