name: Apply Phase 9 Overlay Focus Fix

on:
  push:
    branches:
      - agent/phase9-tivimate-scan-repair
    paths:
      - "ci/phase9-overlay-focus-trigger.txt"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/phase9-tivimate-scan-repair
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Apply overlay focus ownership repair
        run: python ci/patch-phase9-overlay-focus.py
      - name: Commit product and regression changes
        run: |
          if git diff --quiet -- frontend; then
            echo "No product changes needed"
            exit 0
          fi
          git config user.name "Charm Phase 9 Focus Bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/components/TvQuickActionsOverlay.tsx frontend/src/components/ProgramModal.tsx frontend/tests/quickActionsContext.test.mjs
          git commit -m "fix(tv): move focus into long-OK overlays"
          git push origin HEAD:agent/phase9-tivimate-scan-repair
