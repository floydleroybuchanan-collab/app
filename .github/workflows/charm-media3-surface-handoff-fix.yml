name: Charm Media3 surface handoff fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/charm-media3-surface-handoff-fix.yml"
      - ".github/scripts/charm_media3_surface_handoff_fix.py"
      - "frontend/android/app/src/main/java/com/charmiptv/app/NativePlaybackManager.kt"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Validate Media3 TiViMate surface/handoff contract
        run: python3 .github/scripts/charm_media3_surface_handoff_fix.py
