name: Apply Phase 9 Player Rebuffer Watchdog Fix

on:
  push:
    branches:
      - agent/phase9-tivimate-scan-repair
    paths:
      - ".github/workflows/phase9-player-rebuffer-watchdog-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/phase9-tivimate-scan-repair
          fetch-depth: 0
      - name: Apply TiViMate-style explicit-buffering watchdog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/components/StreamPlayer.tsx')
          s = p.read_text()
          old = '''      const now = Date.now();\n      const bufferingSince = bufferingSinceRef.current;\n      const stalledReady =\n        bufferingSince == null &&\n        hasAdvancedPlaybackRef.current &&\n        now - lastPlaybackAdvanceAtRef.current >= BUFFERING_RESYNC_MS;\n      if (bufferingSince == null && !stalledReady) return;\n      const bufferingFor = bufferingSince != null\n        ? now - bufferingSince\n        : now - lastPlaybackAdvanceAtRef.current;\n      if (bufferingFor < BUFFERING_RESYNC_MS) return;\n'''
          new = '''      const now = Date.now();\n      const bufferingSince = bufferingSinceRef.current;\n      // Only an explicit post-playback Media3 loading/buffering state owns recovery.\n      // Live IPTV clocks can pause or emit sparse timeUpdate callbacks without the\n      // decoder actually buffering; treating that as a freeze caused periodic\n      // replaceAsync() reloads on otherwise healthy streams.\n      if (bufferingSince == null) return;\n      const bufferingFor = now - bufferingSince;\n      if (bufferingFor < BUFFERING_RESYNC_MS) return;\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'const stalledReady =' not in s and 'if (bufferingSince == null) return;' in s:
              pass
          else:
              raise SystemExit('buffering watchdog anchor not found')
          p.write_text(s)

          t = Path('frontend/tests/playerAndFocus.test.mjs')
          x = t.read_text()
          block = r'''

test("fullscreen Media3 recovery only arms from a real buffering state", async () => {
  const player = await source("src/components/StreamPlayer.tsx");
  assert.match(player, /if \(bufferingSince == null\) return/);
  assert.match(player, /const bufferingFor = now - bufferingSince/);
  assert.doesNotMatch(player, /const stalledReady =/);
  assert.match(player, /const BUFFERING_RESYNC_MS = 5000/);
  assert.match(player, /const BUFFERING_FAIL_MS = 22000/);
});
'''
          if 'fullscreen Media3 recovery only arms from a real buffering state' not in x:
              t.write_text(x.rstrip() + block + '\n')
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/StreamPlayer.tsx frontend/tests/playerAndFocus.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix(player): stop false periodic Media3 resyncs"
          git push origin HEAD:agent/phase9-tivimate-scan-repair
