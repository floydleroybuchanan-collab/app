name: Phase 9 TiviMate Source Clock Zero

on:
  push:
    branches:
      - phase9/purple-next
    paths:
      - ".github/workflows/phase9-tivimate-source-clock-zero.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase9/purple-next
      - name: Preserve never-refreshed source clocks
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/source.native.ts')
          s = p.read_text()
          replacements = {
            'const playlistLast = cached.playlistRefreshedAt || cached.ts;': 'const playlistLast = cached.playlistRefreshedAt != null ? cached.playlistRefreshedAt : cached.ts;',
            'const guideLast = cached.guideRefreshedAt || cached.ts;': 'const guideLast = cached.guideRefreshedAt != null ? cached.guideRefreshedAt : cached.ts;',
          }
          for old, new in replacements.items():
              if new in s:
                  continue
              if old not in s:
                  raise SystemExit(f'clock marker not found: {old}')
              s = s.replace(old, new)
          p.write_text(s)

          test = Path('frontend/tests/tivimateColdStartPolicy.test.mjs')
          t = test.read_text()
          case = '''\ntest("zero source freshness remains due instead of falling back to playlist age", async () => {\n  const native = await source("src/source.native.ts");\n  assert.match(native, /const playlistLast = cached\\.playlistRefreshedAt != null \\? cached\\.playlistRefreshedAt : cached\\.ts/);\n  assert.match(native, /const guideLast = cached\\.guideRefreshedAt != null \\? cached\\.guideRefreshedAt : cached\\.ts/);\n  assert.doesNotMatch(native, /const guideLast = cached\\.guideRefreshedAt \\|\\| cached\\.ts/);\n});\n'''
          if 'zero source freshness remains due instead of falling back to playlist age' not in t:
              t += case
              test.write_text(t)
          PY
      - name: Commit source clock semantics
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/source.native.ts frontend/tests/tivimateColdStartPolicy.test.mjs
          git commit -m "phase9: preserve zero source freshness clocks"
          git push origin HEAD:phase9/purple-next
