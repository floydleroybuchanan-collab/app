name: Phase 9 - TiviMate player decoder identity

on:
  push:
    branches:
      - phase9/purple-next
    paths:
      - .github/workflows/phase9-tivimate-player-decoder-identity.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: phase9/purple-next
          fetch-depth: 0

      - name: Bind async player callbacks to their decoder channel
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('frontend/app/player.tsx')
          s = path.read_text()

          old_sig = '''  const handleStreamStatus = useCallback(\n    (next: StreamStatus, reason?: SessionFailReason | null) => {\n      setStatus(next);\n'''
          new_sig = '''  const handleStreamStatus = useCallback(\n    (sourceChannelId: string, next: StreamStatus, reason?: SessionFailReason | null) => {\n      // Native decoder callbacks can arrive after a zap has already moved on.\n      // Never let an old decoder mutate the new channel's UI/failure registry.\n      if (!sourceChannelId || sourceChannelId !== channelIdRef.current) return;\n      setStatus(next);\n'''
          if new_sig not in s:
              if old_sig not in s:
                  raise SystemExit('handleStreamStatus signature marker missing')
              s = s.replace(old_sig, new_sig, 1)

          s = s.replace('        noteStreamFailure(channelIdRef.current);', '        noteStreamFailure(sourceChannelId);')
          s = s.replace('        clearStreamFailure(channelIdRef.current);', '        clearStreamFailure(sourceChannelId);')

          old_tracks = '''            onTracksAvailable={(tracks) => {\n              const audio = tracks.audio.filter((track) => track.id !== "" && track.id != null);\n              const text = tracks.text.filter((track) => track.id !== "" && track.id != null);\n'''
          new_tracks = '''            onTracksAvailable={(tracks) => {\n              const sourceChannelId = channelId;\n              if (!sourceChannelId || sourceChannelId !== channelIdRef.current) return;\n              const audio = tracks.audio.filter((track) => track.id !== "" && track.id != null);\n              const text = tracks.text.filter((track) => track.id !== "" && track.id != null);\n'''
          if new_tracks not in s:
              if old_tracks not in s:
                  raise SystemExit('onTracksAvailable marker missing')
              s = s.replace(old_tracks, new_tracks, 1)

          s = s.replace('              const appliedAudioFor = channelIdRef.current;', '              const appliedAudioFor = sourceChannelId;')
          s = s.replace('              const appliedFor = channelIdRef.current;', '              const appliedFor = sourceChannelId;')

          old_status_prop = '            onStatus={handleStreamStatus}\n'
          new_status_prop = '            onStatus={(next, reason) => handleStreamStatus(channelId, next, reason)}\n'
          if new_status_prop not in s:
              if old_status_prop not in s:
                  raise SystemExit('StreamPlayer onStatus marker missing')
              s = s.replace(old_status_prop, new_status_prop, 1)

          path.write_text(s)

          test_path = Path('frontend/tests/playerAndFocus.test.mjs')
          t = test_path.read_text()
          name = 'fullscreen decoder callbacks cannot poison the next channel after a zap'
          if name not in t:
              t += r'''

test("fullscreen decoder callbacks cannot poison the next channel after a zap", async () => {
  const player = await source("app/player.tsx");
  assert.match(player, /\(sourceChannelId: string, next: StreamStatus/);
  assert.match(player, /if \(!sourceChannelId \|\| sourceChannelId !== channelIdRef\.current\) return/);
  assert.match(player, /noteStreamFailure\(sourceChannelId\)/);
  assert.match(player, /clearStreamFailure\(sourceChannelId\)/);
  assert.match(player, /onStatus=\{\(next, reason\) => handleStreamStatus\(channelId, next, reason\)\}/);
  assert.match(player, /onTracksAvailable=\{\(tracks\) => \{[\s\S]{0,120}const sourceChannelId = channelId;[\s\S]{0,120}sourceChannelId !== channelIdRef\.current/);
  assert.match(player, /const appliedAudioFor = sourceChannelId/);
  assert.match(player, /const appliedFor = sourceChannelId/);
});
'''
              test_path.write_text(t)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/player.tsx frontend/tests/playerAndFocus.test.mjs
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "phase9: bind player callbacks to decoder channel"
          git push origin HEAD:phase9/purple-next
