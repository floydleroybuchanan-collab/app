name: Android Native Compile

on:
  pull_request:
    branches:
      - main
      - agent/media3-validation-base-no-apk
    paths:
      - "frontend/android/**"
      - "frontend/src/components/StreamPlayer.tsx"
      - "frontend/src/core/streamPolicy.ts"
      - "frontend/tests/**"
      - "frontend/app/(tabs)/guide.tsx"
      - "ci/tivimate-whole-repo-player-interaction-scan.py"
      - "frontend/plugins/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/app.json"
      - "frontend/scripts/verify-native-config.mjs"
      - ".github/workflows/android-native-ci.yml"
  push:
    branches:
      - main
      - agent/media3-opaque-live-startup-hardening
      - agent/manual-vlc-engine
    paths:
      - "frontend/android/**"
      - "frontend/src/components/StreamPlayer.tsx"
      - "frontend/src/core/streamPolicy.ts"
      - "frontend/tests/**"
      - "frontend/app/(tabs)/guide.tsx"
      - "ci/tivimate-whole-repo-player-interaction-scan.py"
      - "frontend/plugins/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/app.json"
      - "frontend/scripts/verify-native-config.mjs"
      - ".github/workflows/android-native-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: android-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Kotlin Java tests scan no APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android compile SDK and pinned NDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install JavaScript dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Verify checked-in Android configuration and native Guide
        id: config
        continue-on-error: true
        run: |
          npm run verify:native-config
          npm run verify:native-guide

      - name: Unit and wiring tests
        id: tests
        continue-on-error: true
        run: npm test

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Whole-repository player interaction scan
        id: scan
        continue-on-error: true
        working-directory: .
        run: python3 ci/tivimate-whole-repo-player-interaction-scan.py

      - name: Verify opaque startup and locked player budgets
        id: invariants
        continue-on-error: true
        working-directory: .
        run: |
          PLAYER=frontend/android/app/src/main/java/com/charmiptv/app/NativePlaybackManager.kt
          grep -q 'OPAQUE_LIVE_CANDIDATES = listOf("transport", "hls", "dash", "progressive")' "$PLAYER"
          grep -q 'probeReason = "direct:transport"' "$PLAYER"
          grep -q 'startOpaqueCandidate(instance, source, cacheKey, "transport"' "$PLAYER"
          ! grep -q 'NativeOpaqueStreamProbe.start' "$PLAYER"
          ! grep -q 'opaqueProbeHttpClient' "$PLAYER"
          grep -q 'OPAQUE_TYPE_PREFS = "charm_media3_stream_types"' "$PLAYER"
          grep -q 'main.postDelayed(opaqueTypeConfirmation, OPAQUE_CONFIRM_MS)' "$PLAYER"
          grep -q 'private val opaqueTypeConfirmation = Runnable' "$PLAYER"
          grep -q 'confirmSuccessfulStreamType()' "$PLAYER"
          grep -q 'tryNextOpaqueCandidate(created, error)' "$PLAYER"
          grep -q 'forgetDetectedType(cacheKey)' "$PLAYER"
          ! grep -q 'if (firstFrameRendered || !isContainerMismatch(error))' "$PLAYER"
          grep -q 'fun tivimateBufferDurationsMs' "$PLAYER"
          grep -q 'else -> intArrayOf(10_000, 30_000, 2_500, 5_000)' "$PLAYER"
          grep -q 'RECONNECT_STALL_MS = 15_000L' "$PLAYER"
          grep -q 'START_TIMEOUT_MS = 30_000L' "$PLAYER"
          ! grep -q 'HUNG_BUFFER_REPREPARE_MS\|TRANSPORT_HUNG_BUFFER_REPREPARE_MS\|HARD_STALL_RECOVERY_MS\|STABLE_REARM_MS\|MIN_BUFFER_MS_LOW_RAM\|MIN_BUFFER_MS_NORMAL' "$PLAYER"
          grep -q 'readTimeout(0, TimeUnit.SECONDS)' "$PLAYER"
          grep -q 'MAX_AUTO_RECOVERIES = 4' "$PLAYER"
          grep -q 'longArrayOf(0L, 1_000L, 3_000L, 6_000L)' "$PLAYER"

      - name: Compile native Kotlin and Java only
        id: compile
        continue-on-error: true
        env:
          CI: "1"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=1"
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android \
            :ffmpeg-audio:compileDebugJavaWithJavac \
            :app:compileDebugKotlin \
            :app:compileDebugJavaWithJavac \
            --no-daemon --max-workers=1 --stacktrace

      - name: Confirm compile gate produced no APK
        id: noapk
        if: always()
        continue-on-error: true
        run: test ! -d android/app/build/outputs/apk

      - name: Post validation result to draft PR 31
        if: always()
        continue-on-error: true
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Android Native Compile — manual-VLC validation-only"
            echo "commit=${GITHUB_SHA}"
            echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "config=${{ steps.config.outcome }}"
            echo "tests=${{ steps.tests.outcome }}"
            echo "typecheck=${{ steps.typecheck.outcome }}"
            echo "lint=${{ steps.lint.outcome }}"
            echo "whole_repo_scan=${{ steps.scan.outcome }}"
            echo "opaque_invariants=${{ steps.invariants.outcome }}"
            echo "native_compile=${{ steps.compile.outcome }}"
            echo "no_apk=${{ steps.noapk.outcome }}"
            echo "apk_build=NOT_RUN"
            if [ -f ci/tivimate-whole-repo-player-interaction-report.txt ]; then
              echo
              echo '```text'
              cat ci/tivimate-whole-repo-player-interaction-report.txt
              echo '```'
            fi
          } > /tmp/validation.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/31/comments" -f body="$(cat /tmp/validation.md)"

      - name: Enforce validation gate
        if: always()
        run: |
          test "${{ steps.config.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.scan.outcome }}" = "success"
          test "${{ steps.invariants.outcome }}" = "success"
          test "${{ steps.compile.outcome }}" = "success"
          test "${{ steps.noapk.outcome }}" = "success"
