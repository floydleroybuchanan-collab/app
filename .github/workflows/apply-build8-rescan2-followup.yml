name: Apply Build 8 Second Audit Follow-Up

on:
  push:
    branches:
      - fix/purple-next-build8-tester-pass
    paths:
      - ci/apply-build8-rescan2-followup.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/purple-next-build8-tester-pass
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Apply follow-up fixes found by verification rescan
        run: python ci/patch-build8-rescan2-followup.py
      - name: Commit fixes
        run: |
          if git diff --quiet -- frontend; then
            echo "No product changes needed"
            exit 0
          fi
          git config user.name "Build 8 Cross-Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend
          git commit -m "fix(build8): close second-audit recovery gaps"
          git push origin HEAD:fix/purple-next-build8-tester-pass
