name: Phase 9 Fix 6 Percent Playlist Acquisition

on:
  push:
    branches:
      - agent/phase9-tivimate-scan-repair
    paths:
      - ".github/workflows/phase9-fix-6pct-playlist-acquisition.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/phase9-tivimate-scan-repair
      - name: Apply bounded HTTP playlist acquisition repair
        run: python ci/phase9-fix-6pct-playlist-acquisition.py
      - name: Run focused startup regression
        working-directory: frontend
        run: node --experimental-strip-types tests/startupPlaylistAcquisition.test.mjs
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/source.native.ts frontend/tests/startupPlaylistAcquisition.test.mjs frontend/tests/run-tests.mjs
          git commit -m "fix(startup): restore bounded HTTP playlist acquisition"
          git push origin HEAD:agent/phase9-tivimate-scan-repair

# retrigger: HTTP M3U/XMLTV compatibility repair
