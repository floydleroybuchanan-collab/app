name: Code Interaction Audit UI Lifecycle

on:
  push:
    branches:
      - agent/code-interaction-audit
    paths:
      - ci/code-interaction-audit-ui-lifecycle.trigger

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/code-interaction-audit
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply owner-safe UI lifecycle repair
        run: python ci/code-interaction-audit-ui-lifecycle.py
      - name: Validate patch shape
        run: git diff --check
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "Charm Interaction Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/components/TvQuickActionsOverlay.tsx frontend/tests/quickActionsContext.test.mjs
          git commit -m "fix(audit): release Quick Actions ownership on route changes"
          git push origin HEAD:agent/code-interaction-audit
