name: Apply Phase 9 Live TV Repair via PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/phase9-tivimate-scan-repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/phase9-tivimate-scan-repair
          fetch-depth: 0
      - name: Execute checked-in consolidated repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/phase9-live-tv-regression-repair.yml').read_text()
          start = src.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = src.index("\n          PY\n", start)
          lines = src[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith('          ') else line for line in lines) + "\n"
          Path('/tmp/phase9-repair.py').write_text(script)
          PY
          python3 /tmp/phase9-repair.py
      - name: Run focused regression tests
        working-directory: frontend
        run: npm test
      - name: Commit production repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/player.tsx frontend/src/components/StreamPlayer.tsx frontend/src/components/TvQuickActionsOverlay.tsx frontend/android/app/src/main/java/com/charmiptv/app/MainActivity.kt frontend/tests/playerAndFocus.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix(tv): repair player zaps Media3 and long-OK context"
          git push origin HEAD:agent/phase9-tivimate-scan-repair
