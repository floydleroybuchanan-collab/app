name: Phase 9 TiviMate Guide Bottom Boundary No-op

on:
  push:
    branches:
      - phase9/purple-next
    paths:
      - ".github/workflows/phase9-tivimate-guide-bottom-boundary-noop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase9/purple-next
      - name: Avoid repeated Guide work when Down is held at final row
        run: |
          python - <<'PY'
          from pathlib import Path

          native = Path('frontend/android/app/src/main/java/com/charmiptv/app/NativeGuideView.kt')
          s = native.read_text()
          old = '''  private fun moveVertical(delta: Int) {\n    val now = SystemClock.uptimeMillis()\n    moveVelocity = if (now - lastMoveAt < 150L) min(4, moveVelocity + 1) else 0\n    lastMoveAt = now\n    selectedRow = (selectedRow + delta).coerceIn(0, rows.lastIndex)\n    ensureVisible()\n    loadPrograms()\n    invalidate()\n    emitSelection(false)\n    emitRunway(delta)\n  }'''
          new = '''  private fun moveVertical(delta: Int) {\n    val nextRow = (selectedRow + delta).coerceIn(0, rows.lastIndex)\n    if (nextRow == selectedRow) return\n    val now = SystemClock.uptimeMillis()\n    moveVelocity = if (now - lastMoveAt < 150L) min(4, moveVelocity + 1) else 0\n    lastMoveAt = now\n    selectedRow = nextRow\n    ensureVisible()\n    loadPrograms()\n    invalidate()\n    emitSelection(false)\n    emitRunway(delta)\n  }'''
          if 'if (nextRow == selectedRow) return' not in s:
              if old not in s:
                  raise SystemExit('moveVertical marker not found')
              s = s.replace(old, new, 1)
          native.write_text(s)

          test = Path('frontend/tests/guideShellPolish.test.mjs')
          t = test.read_text()
          case = '''\ntest("native Guide does no database or bridge work for blocked vertical moves", async () => {\n  const native = await source("android/app/src/main/java/com/charmiptv/app/NativeGuideView.kt");\n  const move = native.match(/private fun moveVertical\\(delta: Int\\) \\{[\\s\\S]*?\\n  \\}/)?.[0] || "";\n  assert.match(move, /val nextRow = \\(selectedRow \\+ delta\\)\\.coerceIn/);\n  assert.match(move, /if \\(nextRow == selectedRow\\) return/);\n  assert.ok(move.indexOf('if (nextRow == selectedRow) return') < move.indexOf('loadPrograms()'));\n  assert.ok(move.indexOf('if (nextRow == selectedRow) return') < move.indexOf('emitRunway(delta)'));\n});\n'''
          if 'native Guide does no database or bridge work for blocked vertical moves' not in t:
              t += case
              test.write_text(t)
          PY
      - name: Commit Guide bottom boundary no-op
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/android/app/src/main/java/com/charmiptv/app/NativeGuideView.kt frontend/tests/guideShellPolish.test.mjs
          git commit -m "phase9: stop blocked guide repeats at row boundary"
          git push origin HEAD:phase9/purple-next