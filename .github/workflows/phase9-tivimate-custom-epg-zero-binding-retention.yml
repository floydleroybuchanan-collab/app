name: Phase 9 TiviMate Custom EPG Zero-Binding Retention

on:
  push:
    branches:
      - phase9/purple-next
    paths:
      - ".github/workflows/phase9-tivimate-custom-epg-zero-binding-retention.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase9/purple-next
      - name: Keep last-good custom guide when no channels are assigned
        run: |
          python - <<'PY'
          from pathlib import Path

          native = Path('frontend/android/app/src/main/java/com/charmiptv/app/CustomEpgNativeModule.kt')
          s = native.read_text()
          old = '''        if (activeXmltvIds.isEmpty()) {\n          // Consume the feed once so the full channel directory is indexed, but do not\n          // let an empty binding set mean "all programmes" as the old parser did.\n          for (ignored in batches) Unit\n          userDatabase.clear()\n        } else {'''
          new = '''        if (activeXmltvIds.isEmpty()) {\n          // Consume the feed once so the full channel directory is indexed, but do not\n          // let an empty binding set mean "all programmes" as the old parser did.\n          // TiViMate-style retention: zero active bindings means the cached programme\n          // rows are inactive, not disposable. Keeping last-good rows makes toggles and\n          // later re-assignment instant while ownership prevents them from being queried.\n          for (ignored in batches) Unit\n        } else {'''
          if 'zero active bindings means the cached programme' not in s:
              if old not in s:
                  raise SystemExit('zero-binding destructive clear marker not found')
              s = s.replace(old, new, 1)
          native.write_text(s)

          test = Path('frontend/tests/tivimateColdStartPolicy.test.mjs')
          t = test.read_text()
          case = '''\ntest("zero custom EPG bindings retain last-good programme data", async () => {\n  const custom = await source("android/app/src/main/java/com/charmiptv/app/CustomEpgNativeModule.kt");\n  const zeroBindings = custom.match(/if \\(activeXmltvIds\\.isEmpty\\(\\)\\) \\{[\\s\\S]*?\\} else \\{/);\n  assert.ok(zeroBindings, "zero-binding branch missing");\n  assert.doesNotMatch(zeroBindings[0], /userDatabase\\.clear\\(\\)/);\n  assert.match(zeroBindings[0], /last-good rows/);\n});\n'''
          if 'zero custom EPG bindings retain last-good programme data' not in t:
              t += case
              test.write_text(t)
          PY
      - name: Commit zero-binding retention
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/android/app/src/main/java/com/charmiptv/app/CustomEpgNativeModule.kt frontend/tests/tivimateColdStartPolicy.test.mjs
          git commit -m "phase9: retain custom EPG cache with no bindings"
          git push origin HEAD:phase9/purple-next
