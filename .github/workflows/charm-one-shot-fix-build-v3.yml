name: Charm guarded playback repair build v3

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/charm-one-shot-fix-build-v3.yml"

permissions:
  contents: read
  actions: write

jobs:
  fix-refresh-auth-handling:
    # Retired: Media3-only playback; kept for historical reference.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Cloudflare auth failure handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("cloudflare-backend/scripts/build-and-upload.mjs")
          text = path.read_text()
          pattern = r'''  main\(\)\.catch\(\(e\) => \{\n    console\.error\("Builder crashed:", e\);\n    process\.exit\(1\);\n  \}\);'''
          replacement = '''  main().catch((e) => {
            const message = String(e?.message || e || "");
            if (/KV PUT .* failed: (401|403)\\b/.test(message)) {
              console.error("Cloudflare credentials were rejected - keeping last-good KV data:", message);
              console.log("::warning::Cloudflare KV credentials were rejected; refresh was skipped and last-good data remains active. Update CLOUDFLARE_API_TOKEN to resume uploads.");
              return;
            }
            console.error("Builder crashed:", e);
            process.exit(1);
          });'''
          updated, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"Expected exactly one builder catch block, found {count}")
          path.write_text(updated)
          PY
          node --check cloudflare-backend/scripts/build-and-upload.mjs

      - name: Commit fail-safe to main
        run: |
          git config user.name "Charm Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add cloudflare-backend/scripts/build-and-upload.mjs
          git commit -m "fix(data): preserve last-good KV on rejected Cloudflare credentials"
          git push origin HEAD:main

      - name: Dispatch real refresh workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run charm-refresh.yml --ref main

  fix-build-apk:
    # Retired: Media3-only playback; kept for historical reference.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_BRANCH: claude/repo-branch-access-dxx6wf
      EXPO_PUBLIC_M3U_URL: ${{ secrets.M3U_URL || vars.EXPO_PUBLIC_M3U_URL }}
      EXPO_PUBLIC_EPG_URL: ${{ secrets.EPG_URL || vars.EXPO_PUBLIC_EPG_URL }}
      EXPO_PUBLIC_GUIDE_WINDOW_HOURS: ${{ vars.EXPO_PUBLIC_GUIDE_WINDOW_HOURS || '24' }}
      CMAKE_BUILD_PARALLEL_LEVEL: "1"
      CI: "1"
    steps:
      - name: Checkout playback branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: claude/repo-branch-access-dxx6wf
          fetch-depth: 0

      - name: Apply guarded playback and Guide fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one literal match in {path}, found {count}: {old[:100]!r}")
              path.write_text(text.replace(old, new, 1))

          def sub_once(path, pattern, replacement, flags=0):
              text = path.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"Expected exactly one regex match in {path}, found {count}: {pattern[:120]!r}")
              path.write_text(updated)

          mgr = Path("frontend/android/app/src/main/java/com/charmiptv/app/NativePlaybackManager.kt")
          replacements = {
              "private const val MIN_BUFFER_MS_LOW_RAM = 1_000": "private const val MIN_BUFFER_MS_LOW_RAM = 15_000",
              "private const val MAX_BUFFER_MS_LOW_RAM = 2_500": "private const val MAX_BUFFER_MS_LOW_RAM = 45_000",
              "private const val PLAYBACK_BUFFER_MS_LOW_RAM = 500": "private const val PLAYBACK_BUFFER_MS_LOW_RAM = 4_000",
              "private const val REBUFFER_BUFFER_MS_LOW_RAM = 1_000": "private const val REBUFFER_BUFFER_MS_LOW_RAM = 8_000",
              "private const val MIN_BUFFER_MS_NORMAL = 1_000": "private const val MIN_BUFFER_MS_NORMAL = 15_000",
              "private const val MAX_BUFFER_MS_NORMAL = 2_500": "private const val MAX_BUFFER_MS_NORMAL = 45_000",
              "private const val PLAYBACK_BUFFER_MS_NORMAL = 500": "private const val PLAYBACK_BUFFER_MS_NORMAL = 4_000",
              "private const val REBUFFER_BUFFER_MS_NORMAL = 1_000": "private const val REBUFFER_BUFFER_MS_NORMAL = 8_000",
              "private const val HUNG_BUFFER_REPREPARE_MS = 5_000L": "private const val HUNG_BUFFER_REPREPARE_MS = 25_000L",
              "private const val TRANSPORT_HUNG_BUFFER_REPREPARE_MS = 7_000L": "private const val TRANSPORT_HUNG_BUFFER_REPREPARE_MS = 35_000L\n  private const val HARD_STALL_RECOVERY_MS = 45_000L",
              "private const val STABLE_REARM_MS = 30_000L": "private const val STABLE_REARM_MS = 60_000L",
              "private const val FULLSCREEN_START_TIMEOUT_MS = 12_000L": "private const val FULLSCREEN_START_TIMEOUT_MS = 45_000L",
              "private const val PREVIEW_START_TIMEOUT_MS = 8_000L": "private const val PREVIEW_START_TIMEOUT_MS = 45_000L",
              "private const val SOURCE_REFRESH_TIMEOUT_MS = 20_000L": "private const val SOURCE_REFRESH_TIMEOUT_MS = 30_000L",
              ".connectTimeout(5, TimeUnit.SECONDS)": ".connectTimeout(15, TimeUnit.SECONDS)",
              ".readTimeout(5, TimeUnit.SECONDS)": ".readTimeout(30, TimeUnit.SECONDS)",
              ".writeTimeout(5, TimeUnit.SECONDS)": ".writeTimeout(30, TimeUnit.SECONDS)",
          }
          for old, new in replacements.items():
              replace_once(mgr, old, new)

          replace_once(
              mgr,
              '    recordDiagnostic("start-timeout", lastPlaybackError, instance)\n    recoverOnce(instance, skipBarePrepare = activeSource?.sourceType == "transport")',
              '    if (ensureActiveSurfaceBound(instance, "startup-timeout")) {\n      recordDiagnostic("startup-surface-rebound", lastPlaybackError, instance)\n      armStartupTimeout()\n      return@Runnable\n    }\n    recordDiagnostic("start-timeout", lastPlaybackError, instance)\n    recoverOnce(instance, skipBarePrepare = activeSource?.sourceType == "transport")',
          )

          watchdog_pattern = r'''    val recoveryThresholdMs = if \(transport\) TRANSPORT_HUNG_BUFFER_REPREPARE_MS else HUNG_BUFFER_REPREPARE_MS\n    if \(hungForMs < recoveryThresholdMs\) \{.*?\n    recoverOnce\(instance, skipBarePrepare = transport\)'''
          watchdog_replacement = '''    val observationThresholdMs = if (transport) TRANSPORT_HUNG_BUFFER_REPREPARE_MS else HUNG_BUFFER_REPREPARE_MS
            if (hungForMs < observationThresholdMs) {
              main.postDelayed(bufferingWatchdog, minOf(HUNG_BUFFER_REPREPARE_MS, observationThresholdMs - hungForMs))
              return@Runnable
            }

            // Buffering by itself is not a failure. Repair a missing video surface
            // first, then continue observing until the hard no-progress threshold.
            if (ensureActiveSurfaceBound(instance, "buffer-watchdog")) {
              bufferingSinceMs = nowMs
              main.postDelayed(bufferingWatchdog, observationThresholdMs)
              return@Runnable
            }
            if (hungForMs < HARD_STALL_RECOVERY_MS) {
              recordDiagnostic("buffer-stall-observed", lastPlaybackError, instance)
              main.postDelayed(bufferingWatchdog, HARD_STALL_RECOVERY_MS - hungForMs)
              return@Runnable
            }

            recordDiagnostic("buffer-watchdog", lastPlaybackError, instance)
            recoverOnce(instance, skipBarePrepare = transport)'''
          sub_once(mgr, watchdog_pattern, watchdog_replacement, re.S)

          surface_pattern = r'''  fun attachSurface\(surfaceOwner: Owner, surface: FrameLayout\) = runOnMain \{.*?^  fun setResizeMode'''
          surface_replacement = '''  fun attachSurface(surfaceOwner: Owner, surface: FrameLayout) = runOnMain {
            when (surfaceOwner) { Owner.PREVIEW -> previewSurface = surface; Owner.FULLSCREEN -> fullscreenSurface = surface; Owner.NONE -> return@runOnMain }
            val video = ensurePlayerViewIn(surfaceOwner, surface)
            if (owner == surfaceOwner) {
              val instance = player
              video.player = instance
              video.visibility = if (instance != null) View.VISIBLE else View.GONE
              if (instance != null && activeSource != null) {
                instance.playWhenReady = true
                recordDiagnostic("surface-attached", lastPlaybackError, instance)
              }
            }
          }
          fun detachSurface(surfaceOwner: Owner, surface: FrameLayout) = runOnMain {
            val attached = when (surfaceOwner) { Owner.PREVIEW -> previewSurface; Owner.FULLSCREEN -> fullscreenSurface; Owner.NONE -> null }
            if (attached !== surface) return@runOnMain
            val video = playerViewFor(surfaceOwner)
            val instance = player
            if (owner == surfaceOwner && instance != null) {
              // Pause before unbinding video so audio can never keep running with
              // no output surface. A replacement surface resumes this same player.
              instance.playWhenReady = false
              recordDiagnostic("surface-detached", lastPlaybackError, instance)
              publishState("loading", "surface-detached")
            }
            if (video?.parent === surface) { try { video.player = null } catch (_: Throwable) {} }
            when (surfaceOwner) {
              Owner.PREVIEW -> { previewSurface = null; previewPlayerView = null }
              Owner.FULLSCREEN -> { fullscreenSurface = null; fullscreenPlayerView = null }
              Owner.NONE -> Unit
            }
          }
          fun setResizeMode'''
          sub_once(mgr, surface_pattern, surface_replacement, re.S | re.M)

          player_view_block = '  private fun playerViewFor(target: Owner): PlayerView? = when (target) {\n    Owner.PREVIEW -> previewPlayerView\n    Owner.FULLSCREEN -> fullscreenPlayerView\n    Owner.NONE -> null\n  }'
          helper = '''  private fun playerViewFor(target: Owner): PlayerView? = when (target) {
            Owner.PREVIEW -> previewPlayerView
            Owner.FULLSCREEN -> fullscreenPlayerView
            Owner.NONE -> null
          }

          private fun ensureActiveSurfaceBound(instance: ExoPlayer, event: String): Boolean {
            val activeOwner = owner
            if (activeOwner == Owner.NONE || player !== instance) return false
            val target = when (activeOwner) {
              Owner.PREVIEW -> previewSurface
              Owner.FULLSCREEN -> fullscreenSurface
              Owner.NONE -> null
            } ?: return false
            val video = ensurePlayerViewIn(activeOwner, target)
            if (video.player === instance && video.visibility == View.VISIBLE) return false
            return try {
              video.player = instance
              video.visibility = View.VISIBLE
              if (activeSource != null) instance.playWhenReady = true
              recordDiagnostic("surface-rebind:$event", lastPlaybackError, instance)
              true
            } catch (failure: Throwable) {
              Log.w(TAG, "surface rebind failed: $event", failure)
              false
            }
          }'''
          replace_once(mgr, player_view_block, helper)

          replace_once(
              mgr,
              '              Player.STATE_READY -> {\n                main.removeCallbacks(bufferingWatchdog)\n                resetBufferingWatchdogState()',
              '              Player.STATE_READY -> {\n                main.removeCallbacks(bufferingWatchdog)\n                resetBufferingWatchdogState()\n                ensureActiveSurfaceBound(created, "state-ready")',
          )

          guide = Path("frontend/app/(tabs)/guide.tsx")
          replace_once(
              guide,
              '  const previewVisible =\n    !hidePreview &&\n    !!channel?.url &&\n    previewId === channel.id &&\n    previewStatus !== "error";',
              '  const previewVisible =\n    !hidePreview &&\n    !!channel?.url &&\n    previewId === channel.id;',
          )
          replace_once(
              guide,
              '  const onPreviewStatus = useCallback((status: StreamStatus) => {\n    setPreviewStatus(status);\n  }, []);',
              '  const onPreviewStatus = useCallback((status: StreamStatus) => {\n    setPreviewStatus(status);\n    if (status !== "error") return;\n    if (previewRecoverTimer.current) clearTimeout(previewRecoverTimer.current);\n    previewRecoverTimer.current = setTimeout(() => {\n      previewRecoverTimer.current = null;\n      setPreviewStatus("loading");\n      setPreviewEpoch((value) => value + 1);\n    }, 1_500);\n  }, []);',
          )

          native_epg = Path("frontend/src/nativeEpg.ts")
          replace_once(native_epg, 'const PLAYLIST_FETCH_TIMEOUT_MS = 45_000;', 'const PLAYLIST_FETCH_TIMEOUT_MS = 45_000;\nconst MATCH_SYNC_TIMEOUT_MS = 8_000;')
          replace_once(
              native_epg,
              'export async function upsertNativePlaylistEpgMatches(matches: NativePlaylistEpgMatchRow[], guideEpoch: number): Promise<void> { if (nativeModule?.upsertPlaylistEpgMatches) await nativeModule.upsertPlaylistEpgMatches(matches, guideEpoch); if (ramModule) await ramModule.replaceMatches(matches); }',
              '''export async function upsertNativePlaylistEpgMatches(matches: NativePlaylistEpgMatchRow[], guideEpoch: number): Promise<void> {
            const tasks: Promise<unknown>[] = [];
            if (nativeModule?.upsertPlaylistEpgMatches) tasks.push(nativeModule.upsertPlaylistEpgMatches(matches, guideEpoch));
            if (ramModule) tasks.push(ramModule.replaceMatches(matches));
            if (!tasks.length) return;
            let timeout: ReturnType<typeof setTimeout> | null = null;
            try {
              await Promise.race([
                Promise.all(tasks.map((task) => task.catch(() => undefined))).then(() => undefined),
                new Promise<void>((resolve) => { timeout = setTimeout(resolve, MATCH_SYNC_TIMEOUT_MS); }),
              ]);
            } finally {
              if (timeout) clearTimeout(timeout);
            }
          }''',
          )

          # Guard the requested profile and key structural changes before validation.
          final = mgr.read_text()
          for token in [
              'MIN_BUFFER_MS_NORMAL = 15_000', 'MAX_BUFFER_MS_NORMAL = 45_000',
              'PLAYBACK_BUFFER_MS_NORMAL = 4_000', 'REBUFFER_BUFFER_MS_NORMAL = 8_000',
              'HARD_STALL_RECOVERY_MS = 45_000L', '.readTimeout(30, TimeUnit.SECONDS)',
              'surface-rebind:$event', 'surface-detached',
          ]:
              if token not in final:
                  raise SystemExit(f"Missing expected playback patch token: {token}")
          PY

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install JavaScript dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build pinned LGPL FFmpeg audio extension
        working-directory: frontend
        run: |
          chmod +x scripts/build-media3-ffmpeg-audio.sh
          ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/27.1.12297006" ./scripts/build-media3-ffmpeg-audio.sh

      - name: Configure deterministic low-memory build
        working-directory: frontend
        run: |
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.workers.max=1
          org.gradle.vfs.watch=false
          kotlin.compiler.execution.strategy=in-process
          kotlin.daemon.enabled=false
          reactNativeArchitectures=armeabi-v7a,arm64-v8a
          EOF

      - name: Build universal sideload APK
        working-directory: frontend
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android :app:assembleSideload --no-daemon --max-workers=1 --stacktrace

      - name: Verify universal APK contents
        working-directory: frontend
        run: |
          APK="android/app/build/outputs/apk/sideload/app-sideload.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -Eq "(assets/index\.android\.bundle|assets/.*\.bundle)"
          unzip -l "$APK" | grep -q "lib/armeabi-v7a/"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/"
          mkdir -p artifacts
          cp "$APK" "artifacts/CharmIPTV-relaxed-player-fixes-${GITHUB_RUN_NUMBER}.apk"
          sha256sum "artifacts/CharmIPTV-relaxed-player-fixes-${GITHUB_RUN_NUMBER}.apk" > artifacts/SHA256SUMS.txt

      - name: Commit validated fixes to playback branch
        shell: bash
        run: |
          git config user.name "Charm Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/android/app/src/main/java/com/charmiptv/app/NativePlaybackManager.kt frontend/app/'(tabs)'/guide.tsx frontend/src/nativeEpg.ts
          git commit -m "fix(player): relax IPTV recovery and repair video surface lifecycle"
          git push origin HEAD:"$TARGET_BRANCH"

      - name: Upload sideload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CharmIPTV-relaxed-player-fixes-${{ github.run_number }}
          path: |
            frontend/artifacts/CharmIPTV-relaxed-player-fixes-${{ github.run_number }}.apk
            frontend/artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
