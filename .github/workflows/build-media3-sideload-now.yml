name: Build Charming MediaLab RC.25.4 Update Sideload APK

on:
  workflow_dispatch:
  # Test a signed owner-only build for the unified single-Activity VOD PR.
  # Fork PRs never receive signing or provider secrets.
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-media3-sideload-now.yml"
      - "frontend/**"
      - "ci/release-update-baseline.json"
      - "ci/verify-release-update.py"
      - "ci/verify-android-apk.py"
      - "ci/test_release_update_contract.py"
      - "ci/sideload-artifact-public.pem"
  push:
    branches:
      - feature/multiple-playlists-test-1
    paths:
      - ".github/workflows/build-media3-sideload-now.yml"
      - "frontend/.media3-sideload-build-trigger"
      - "frontend/src/**"
      - "frontend/app/**"
      - "frontend/android/**"
      - "frontend/scripts/**"
      - "frontend/tests/**"
      - "frontend/package*.json"
      - "ci/verify-android-apk.py"
      - "ci/verify-release-update.py"
      - "ci/release-update-baseline.json"
      - "ci/verify-media3-only.py"
      - "ci/media3_source_contract.py"
      - "ci/playlist_source_contract.py"
      - "ci/tivimate-whole-repo-player-interaction-scan.py"
      - "ci/test_*.py"
      - "ci/retired-player-automation.json"
      - "ci/protect-sideload-artifact.mjs"
      - "ci/sideload-artifact-public.pem"

permissions:
  contents: read

concurrency:
  group: medialab-rc25-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Charming MediaLab RC.25.4 updateable universal sideload APK
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.head_ref == 'fix/tv-focus-vod-guide-20261109' || github.head_ref == 'feature/vod-ux-platforms-rc25-20261109' || github.head_ref == 'fix/unified-vod-one-activity-20261109') && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/feature/multiple-playlists-test-1') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "1"
      REAL_DEBRID_CLIENT_ID: ${{ vars.REAL_DEBRID_CLIENT_ID }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      SUBDL_API_KEY: ${{ secrets.SUBDL_API_KEY }}
      RABBITSTREAM_SOURCE_API: ${{ secrets.RABBITSTREAM_SOURCE_API }}
      UPROT_MSFI_API_BASE: ${{ secrets.UPROT_MSFI_API_BASE }}
      UPROT_MSE_API_BASE: ${{ secrets.UPROT_MSE_API_BASE }}
      UPROT_API_KEY: ${{ secrets.UPROT_API_KEY }}
      EXPO_NO_DOTENV: "1"
      CMAKE_BUILD_PARALLEL_LEVEL: "1"
      CHARM_KEYSTORE_B64: ${{ secrets.CHARM_KEYSTORE_B64 }}
      CHARM_UPLOAD_STORE_FILE: charm-upload.jks
      CHARM_UPLOAD_STORE_PASSWORD: ${{ secrets.CHARM_UPLOAD_STORE_PASSWORD }}
      CHARM_UPLOAD_KEY_ALIAS: ${{ secrets.CHARM_UPLOAD_KEY_ALIAS }}
      CHARM_UPLOAD_KEY_PASSWORD: ${{ secrets.CHARM_UPLOAD_KEY_PASSWORD }}
      EXPO_PUBLIC_GUIDE_WINDOW_HOURS: ${{ vars.EXPO_PUBLIC_GUIDE_WINDOW_HOURS || '24' }}

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify upgrade identity and owner decryptor key from Build 267
        working-directory: .
        run: python3 ci/verify-release-update.py

      - name: Verify live VOD catalog and poster access
        run: node scripts/verify-vod-catalog.mjs

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK and pinned NDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Verify preserved VOD source
        run: node scripts/verify-vod-source.mjs

      - name: Prepare pinned Nova playback libraries
        run: python3 scripts/prepare-nova.py

      - name: Configure owner release signing
        run: |
          test -n "${CHARM_KEYSTORE_B64}"
          test -n "${CHARM_UPLOAD_STORE_PASSWORD}"
          test -n "${CHARM_UPLOAD_KEY_ALIAS}"
          test -n "${CHARM_UPLOAD_KEY_PASSWORD}"
          printf '%s' "${CHARM_KEYSTORE_B64}" | base64 --decode > android/app/charm-upload.jks
          test -s android/app/charm-upload.jks

      - name: Verify protected managed-content wiring
        run: |
          test -z "${EXPO_PUBLIC_M3U_URL:-}"
          test -z "${EXPO_PUBLIC_EPG_URL:-}"
          grep -q 'getManagedContentAccess' src/auth/AuthContext.tsx
          grep -q '/content/access' src/auth/accountApi.ts

      - name: Verify native architecture and config
        run: |
          npm run verify:native-guide
          npm run verify:native-config

      - name: Unit and wiring tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Whole-repository player interaction scan
        working-directory: .
        run: python3 ci/tivimate-whole-repo-player-interaction-scan.py

      - name: Verify Media3-only source and retired automation
        working-directory: .
        run: |
          python3 ci/verify-media3-only.py
          python3 -m unittest discover -s ci -p 'test_*.py'

      - name: Build pinned LGPL FFmpeg audio extension
        run: |
          chmod +x scripts/build-media3-ffmpeg-audio.sh
          ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/27.1.12297006" ./scripts/build-media3-ffmpeg-audio.sh

      - name: Configure deterministic low-memory build
        run: |
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.workers.max=1
          org.gradle.vfs.watch=false
          kotlin.compiler.execution.strategy=in-process
          kotlin.daemon.enabled=false
          reactNativeArchitectures=armeabi-v7a,arm64-v8a
          charm.requireProtectedSigning=true
          android.enableMinifyInReleaseBuilds=false
          android.enableShrinkResourcesInReleaseBuilds=false
          charm.enableR8Optimization=false
          EOF

      - name: Compile sideload Kotlin and Java
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android :app:compileSideloadKotlin :app:compileSideloadJavaWithJavac :app:testSideloadUnitTest :vod:testSideloadUnitTest --no-daemon --max-workers=1 --stacktrace

      - name: Check Android 7 native API compatibility
        # Lint before packaging catches calls that compile with API 36 but crash
        # on the API 24/25 televisions this release now supports.
        run: ./android/gradlew -p android :app:lintSideload :vod:lintSideload -Pcharm.compatibilityAudit=true --no-daemon --max-workers=1 --stacktrace

      - name: Package signed universal sideload APK
        run: ./android/gradlew -p android :app:assembleSideload --no-daemon --max-workers=1 --stacktrace

      - name: Verify Media3-only APK and checksum
        run: |
          APK="android/app/build/outputs/apk/sideload/app-sideload.apk"
          test -f "$APK"
          unzip -l "$APK" > apk-contents.txt
          grep -Eq 'assets/index.android.bundle|assets/.*\.bundle' apk-contents.txt
          grep -q 'lib/armeabi-v7a/' apk-contents.txt
          grep -q 'lib/arm64-v8a/' apk-contents.txt
          grep -Eq 'libffmpeg|ffmpeg' apk-contents.txt
          if unzip -p "$APK" assets/index.android.bundle | grep -a -q 'm3u4u\.com'; then
            echo 'Managed provider origin leaked into the APK bundle.' >&2
            exit 1
          fi
          APKSIGNER="$(find "${ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          CERTS="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$CERTS" | grep -q 'Verified'
          if printf '%s\n' "$CERTS" | grep -qi 'Android Debug'; then
            echo 'Protected sideload APK was signed with the Android debug certificate.' >&2
            exit 1
          fi
          mkdir -p artifacts
          python3 ../ci/verify-android-apk.py "$APK" --output artifacts/APK_VERIFICATION.json
          cp "$APK" "artifacts/Charming.MediaLab-2.2.5-RC25.4-Sideload-${GITHUB_RUN_NUMBER}.apk"
          sha256sum "artifacts/Charming.MediaLab-2.2.5-RC25.4-Sideload-${GITHUB_RUN_NUMBER}.apk" > artifacts/SHA256SUMS.txt
          printf 'source_commit=%s\nvalidation_run=%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" "${GITHUB_RUN_ID}" > artifacts/BUILD_INFO.txt

      - name: Protect provider-bearing artifact for the owner
        run: |
          mkdir -p protected-artifacts
          python3 -m zipfile -c sideload-private.zip artifacts/*
          node ../ci/protect-sideload-artifact.mjs encrypt ../ci/sideload-artifact-public.pem sideload-private.zip protected-artifacts/sideload.zip.enc

      - name: Upload encrypted sideload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Charming.MediaLab-RC25.4-Sideload-Encrypted-${{ github.run_number }}
          path: |
            frontend/protected-artifacts/sideload.zip.enc
            frontend/protected-artifacts/sideload.zip.enc.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Remove temporary signing material
        if: always()
        run: rm -f android/app/charm-upload.jks
