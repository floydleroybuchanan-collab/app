name: Build CharmIPTV Media3 + VLC Sideload APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent/media3-player-core-rebuild
      - agent/manual-vlc-engine
      - fix/tivimate-m3u-epg-ci-align
    paths:
      - ".github/workflows/build-media3-sideload-now.yml"
      - "frontend/.media3-sideload-build-trigger"
  pull_request:
    paths:
      - ".github/workflows/build-media3-sideload-now.yml"
      - "frontend/.media3-sideload-build-trigger"

permissions:
  contents: write
  issues: write

concurrency:
  group: media3-vlc-sideload-now-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Media3 + VLC universal sideload APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "1"
      CMAKE_BUILD_PARALLEL_LEVEL: "1"
      EXPO_PUBLIC_M3U_URL: ${{ secrets.M3U_URL || vars.EXPO_PUBLIC_M3U_URL }}
      EXPO_PUBLIC_EPG_URL: ${{ secrets.EPG_URL || vars.EXPO_PUBLIC_EPG_URL }}
      EXPO_PUBLIC_GUIDE_WINDOW_HOURS: ${{ vars.EXPO_PUBLIC_GUIDE_WINDOW_HOURS || '24' }}

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Publish build run pointer
        if: github.ref_name == 'agent/manual-vlc-engine'
        working-directory: .
        run: |
          printf '%s\n' "${GITHUB_RUN_ID}" > .github/manual-vlc-sideload-current-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/manual-vlc-sideload-current-run.txt
          git commit -m "ci: record Media3 VLC sideload run ${GITHUB_RUN_ID}" || true
          git push origin HEAD:agent/manual-vlc-engine

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android SDK and pinned NDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Verify locked build sources
        run: |
          test -n "${EXPO_PUBLIC_M3U_URL}"
          test -n "${EXPO_PUBLIC_EPG_URL}"

      - name: Verify native architecture and config
        run: |
          npm run verify:native-guide
          npm run verify:native-config

      - name: Unit and wiring tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Whole-repository player interaction scan
        working-directory: .
        run: python3 ci/tivimate-whole-repo-player-interaction-scan.py

      - name: Verify exclusive Media3-first and VLC-fallback invariants
        working-directory: .
        run: |
          set -euo pipefail
          PLAYER=frontend/android/app/src/main/java/com/charmiptv/app/NativePlaybackManager.kt
          VLC=frontend/android/app/src/main/java/com/charmiptv/app/NativeVlcPlaybackManager.kt
          COORDINATOR=frontend/src/core/nativePlaybackCoordinator.ts
          POLICY=frontend/src/core/streamPolicy.ts
          PREFERENCE=frontend/src/playerEnginePreference.ts
          SETTINGS='frontend/app/(tabs)/settings.tsx'
          grep -q 'org.videolan.android:libvlc-all:3.7.5' frontend/android/app/build.gradle
          grep -q 'media3-exoplayer-rtsp:1.8.0' frontend/android/app/build.gradle
          grep -q 'MediaPlayer(core)' "$VLC"
          grep -q 'setHWDecoderEnabled(source.hardwareDecode, false)' "$VLC"
          ! grep -q 'NativePlaybackManager.stopForEngineSwitch()' "$VLC"
          grep -q 'let operation: Promise<void> = Promise.resolve()' "$COORDINATOR"
          grep -q 'active.engine !== engine' "$COORDINATOR"
          ! grep -Eq 'Promise\.all|Promise\.allSettled' "$COORDINATOR"
          grep -q 'Automatic (Media3 → VLC)' "$SETTINGS"
          grep -q 'cachedPreference: PlayerEnginePreference = "auto"' "$PREFERENCE"
          grep -q 'Automatic mode has exactly one cross-engine fallback' "$POLICY"
          grep -q 'fun tivimateBufferDurationsMs' "$PLAYER"
          grep -q '"low_latency" -> intArrayOf(1_000, 5_000, 500, 1_000)' "$PLAYER"
          grep -q '"balanced" -> intArrayOf(3_000, 15_000, 1_000, 2_000)' "$PLAYER"
          grep -q 'else -> intArrayOf(10_000, 30_000, 1_500, 3_000)' "$PLAYER"
          grep -q 'TARGET_BUFFER_BYTES_LOW_RAM = 16 \* 1024 \* 1024' "$PLAYER"
          grep -q 'TARGET_BUFFER_BYTES_NORMAL = 48 \* 1024 \* 1024' "$PLAYER"
          grep -q 'connectTimeout(20, TimeUnit.SECONDS)' frontend/android/app/src/main/java/com/charmiptv/app/CharmHttpClients.kt
          grep -q 'readTimeout(20, TimeUnit.SECONDS)' frontend/android/app/src/main/java/com/charmiptv/app/CharmHttpClients.kt
          grep -q 'writeTimeout(0, TimeUnit.SECONDS)' frontend/android/app/src/main/java/com/charmiptv/app/CharmHttpClients.kt
          grep -q 'CharmHttpClients.mediaClient()' "$PLAYER"
          grep -q 'START_TIMEOUT_MS = 30_000L' "$PLAYER"
          grep -q 'MAX_ERROR_RECOVERIES = 1' "$PLAYER"
          grep -q 'MAX_ERROR_RECOVERIES = 1' "$VLC"
          grep -q 'OPAQUE_CONFIRM_MS = 5_000L' "$PLAYER"
          grep -q 'main.postDelayed(opaqueTypeConfirmation, OPAQUE_CONFIRM_MS)' "$PLAYER"
          grep -q 'DefaultHlsExtractorFactory(liveTsFlags, true)' "$PLAYER"
          grep -q 'DashMediaSource.Factory' "$PLAYER"
          grep -q 'setWakeMode(C.WAKE_MODE_NETWORK)' "$PLAYER"
          ! grep -Eq 'RECONNECT_STALL_MS|WATCHDOG_POLL_MS|bufferingWatchdog|MAX_AUTO_RECOVERIES|RECOVERY_BACKOFF_MS|silentAudioCheck' "$PLAYER"
          grep -q 'mutedState' "$PLAYER"
          grep -q 'mutedState' "$VLC"
          grep -q 'OPAQUE_LIVE_CANDIDATES = listOf("progressive", "hls", "dash")' "$PLAYER"
          grep -q 'OpaqueAttempt(source.uri, type)' "$PLAYER"
          test ! -e frontend/android/app/src/main/java/com/charmiptv/app/NativeOpaqueStreamProbe.kt

      - name: Build pinned LGPL FFmpeg audio extension
        run: |
          chmod +x scripts/build-media3-ffmpeg-audio.sh
          ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/27.1.12297006" ./scripts/build-media3-ffmpeg-audio.sh

      - name: Configure deterministic low-memory build
        run: |
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.workers.max=1
          org.gradle.vfs.watch=false
          kotlin.compiler.execution.strategy=in-process
          kotlin.daemon.enabled=false
          reactNativeArchitectures=armeabi-v7a,arm64-v8a
          EOF

      - name: Compile sideload Kotlin and Java
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android :app:compileSideloadKotlin :app:compileSideloadJavaWithJavac --no-daemon --max-workers=1 --stacktrace

      - name: Build universal sideload APK
        run: ./android/gradlew -p android :app:assembleSideload --no-daemon --max-workers=1 --stacktrace

      - name: Verify Media3 VLC APK and checksum
        run: |
          APK="android/app/build/outputs/apk/sideload/app-sideload.apk"
          test -f "$APK"
          unzip -l "$APK" > apk-contents.txt
          grep -Eq 'assets/index.android.bundle|assets/.*\.bundle' apk-contents.txt
          grep -q 'lib/armeabi-v7a/' apk-contents.txt
          grep -q 'lib/arm64-v8a/' apk-contents.txt
          grep -Eq 'libffmpeg|ffmpeg' apk-contents.txt
          grep -q 'lib/armeabi-v7a/libvlc.so' apk-contents.txt
          grep -q 'lib/arm64-v8a/libvlc.so' apk-contents.txt
          grep -Eq 'lib/armeabi-v7a/libvlcjni[^/]*\.so' apk-contents.txt
          grep -Eq 'lib/arm64-v8a/libvlcjni[^/]*\.so' apk-contents.txt
          mkdir -p artifacts
          cp "$APK" "artifacts/CharmIPTV-Media3-VLC-Sideload-${GITHUB_RUN_NUMBER}.apk"
          sha256sum "artifacts/CharmIPTV-Media3-VLC-Sideload-${GITHUB_RUN_NUMBER}.apk" > artifacts/SHA256SUMS.txt
          printf 'source_commit=%s\nvalidation_run=%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" "${GITHUB_RUN_ID}" > artifacts/BUILD_INFO.txt

      - name: Upload sideload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CharmIPTV-Media3-VLC-Sideload-${{ github.run_number }}
          path: |
            frontend/artifacts/CharmIPTV-Media3-VLC-Sideload-${{ github.run_number }}.apk
            frontend/artifacts/SHA256SUMS.txt
            frontend/artifacts/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
