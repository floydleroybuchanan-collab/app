name: Phase 9 TiviMate Cold Start Source Separation

on:
  push:
    branches:
      - phase9/purple-next
    paths:
      - ".github/workflows/phase9-tivimate-coldstart-source-separation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase9/purple-next
      - name: Keep provider logo source separate and skip redundant boot writes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/source.native.ts')
          s = p.read_text()
          s = s.replace(
              '      logo: channel.logo || "",\n      group: channel.group || "",',
              '      logo: channel.playlist_logo || channel.logo || "",\n      group: channel.group || "",',
              1,
          )
          s = s.replace(
              '      `${channel.id}\\0${channel.raw_tvg_id || channel.tvg_id || ""}\\0${channel.name || ""}\\0${channel.logo || ""}\\0${channel.group || ""}\\x01`,',
              '      `${channel.id}\\0${channel.raw_tvg_id || channel.tvg_id || ""}\\0${channel.name || ""}\\0${channel.playlist_logo || channel.logo || ""}\\0${channel.group || ""}\\x01`,',
              1,
          )
          old = '''    // Rebuild SQL playlist/match tables after upgrade or cold start (queryGuideWindow needs them).\n    void syncPlaylistToNative(cached.channels, cached.playlistEpoch || 0)\n      .then(() => syncMatchesToNative(cached.channels, cached.guideEpoch || 0))\n      .catch(() => undefined);\n    scheduleStartupSourceRefresh();'''
          new = '''    // A native snapshot came from these exact SQL tables; keep cold start read-only.\n    // JSON fallback/legacy caches still rebuild native indexes after upgrade.\n    if (!nativeCached) {\n      void syncPlaylistToNative(cached.channels, cached.playlistEpoch || 0)\n        .then(() => syncMatchesToNative(cached.channels, cached.guideEpoch || 0))\n        .catch(() => undefined);\n    }\n    scheduleStartupSourceRefresh();'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'if (!nativeCached)' not in s:
              raise SystemExit('cold-start rebuild marker not found')
          p.write_text(s)
          PY
      - name: Commit cold-start source separation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/source.native.ts
          git commit -m "phase9: keep native cold start read-only and logos separated"
          git push origin HEAD:phase9/purple-next
