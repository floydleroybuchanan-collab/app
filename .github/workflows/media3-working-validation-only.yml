name: Media3 Working Validation Only

on:
  push:
    branches:
      - agent/media3-opaque-live-startup-hardening
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: media3-working-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout full history for whole-repo scan
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android compile SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Verify native configuration and guide architecture
        id: nativecfg
        continue-on-error: true
        working-directory: frontend
        run: |
          npm run verify:native-guide
          npm run verify:native-config

      - name: Unit and wiring tests
        id: tests
        continue-on-error: true
        working-directory: frontend
        run: npm test

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        id: lint
        continue-on-error: true
        working-directory: frontend
        run: npm run lint

      - name: Whole-repository player interaction scan
        id: scan
        continue-on-error: true
        run: python3 ci/tivimate-whole-repo-player-interaction-scan.py

      - name: Verify opaque startup invariants
        id: invariants
        continue-on-error: true
        run: |
          PLAYER=frontend/android/app/src/main/java/com/charmiptv/app/NativePlaybackManager.kt
          PROBE=frontend/android/app/src/main/java/com/charmiptv/app/NativeOpaqueStreamProbe.kt
          grep -q 'OPAQUE_LIVE_CANDIDATES = listOf("transport", "hls", "dash", "progressive")' "$PLAYER"
          grep -q 'val firstType = detectedType ?: "transport"' "$PLAYER"
          ! grep -q 'val routedType = detectedType ?: "progressive"' "$PLAYER"
          grep -q 'OPAQUE_TYPE_PREFS = "charm_media3_stream_types"' "$PLAYER"
          grep -q 'confirmSuccessfulStreamType()' "$PLAYER"
          grep -q 'tryNextOpaqueCandidate(created, error)' "$PLAYER"
          grep -q 'forgetDetectedType(cacheKey)' "$PLAYER"
          grep -q 'ConnectionPool(6, 5, TimeUnit.MINUTES)' "$PLAYER"
          grep -q 'MIN_BUFFER_MS_LOW_RAM = 10_000' "$PLAYER"
          grep -q 'MAX_BUFFER_MS_LOW_RAM = 30_000' "$PLAYER"
          grep -q 'PLAYBACK_BUFFER_MS_LOW_RAM = 2_500' "$PLAYER"
          grep -q 'REBUFFER_BUFFER_MS_LOW_RAM = 5_000' "$PLAYER"
          grep -q 'MIN_BUFFER_MS_NORMAL = 15_000' "$PLAYER"
          grep -q 'MAX_BUFFER_MS_NORMAL = 60_000' "$PLAYER"
          grep -q 'PLAYBACK_BUFFER_MS_NORMAL = 3_000' "$PLAYER"
          grep -q 'REBUFFER_BUFFER_MS_NORMAL = 5_000' "$PLAYER"
          grep -q 'readTimeout(20, TimeUnit.SECONDS)' "$PLAYER"
          grep -q 'MAX_AUTO_RECOVERIES = 4' "$PLAYER"
          grep -q 'longArrayOf(0L, 1_000L, 3_000L, 6_000L)' "$PLAYER"
          grep -q 'val metadataType = sourceTypeFromMimeOrUri' "$PROBE"
          grep -q 'MAX_SNIFF_BYTES = 4 \* 1024' "$PROBE"

      - name: Compile native Kotlin and Java only
        id: compile
        continue-on-error: true
        env:
          CI: "1"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=1"
        run: |
          chmod +x frontend/android/gradlew
          ./frontend/android/gradlew -p frontend/android \
            :ffmpeg-audio:compileDebugJavaWithJavac \
            :app:compileDebugKotlin \
            :app:compileDebugJavaWithJavac \
            --no-daemon --max-workers=1 --stacktrace

      - name: Report validation result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Media3 opaque-live VALIDATION-ONLY result"
            echo "commit=${GITHUB_SHA}"
            echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "native_config=${{ steps.nativecfg.outcome }}"
            echo "tests=${{ steps.tests.outcome }}"
            echo "typecheck=${{ steps.typecheck.outcome }}"
            echo "lint=${{ steps.lint.outcome }}"
            echo "whole_repo_scan=${{ steps.scan.outcome }}"
            echo "opaque_invariants=${{ steps.invariants.outcome }}"
            echo "native_compile=${{ steps.compile.outcome }}"
            echo "apk_build=NOT_RUN"
            if [ -f ci/tivimate-whole-repo-player-interaction-report.txt ]; then
              echo
              echo 'Whole-repo scan:'
              echo '```text'
              cat ci/tivimate-whole-repo-player-interaction-report.txt
              echo '```'
            fi
          } > /tmp/media3-validation-comment.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/29/comments" -f body="$(cat /tmp/media3-validation-comment.md)"

      - name: Enforce validation gate
        if: always()
        run: |
          test "${{ steps.nativecfg.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.scan.outcome }}" = "success"
          test "${{ steps.invariants.outcome }}" = "success"
          test "${{ steps.compile.outcome }}" = "success"
