name: Phase 9 Settings Focus Lifecycle

on:
  push:
    branches:
      - phase9/purple-next
    paths:
      - "ci/phase9-settings-focus-lifecycle.trigger"
      - "ci/phase9-settings-focus-lifecycle.py"
      - ".github/workflows/phase9-settings-focus-lifecycle.yml"

permissions:
  contents: write

concurrency:
  group: phase9-settings-focus-lifecycle
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase9/purple-next
      - name: Apply guarded focus lifecycle repair
        run: python ci/phase9-settings-focus-lifecycle.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'frontend/app/(tabs)/settings.tsx' frontend/app/group-settings.tsx
          git commit -m "Phase 9: normalize settings focus lifecycle" || exit 0
          git pull --rebase origin phase9/purple-next
          git push origin HEAD:phase9/purple-next
