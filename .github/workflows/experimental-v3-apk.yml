name: Experimental v3 APK

on:
  workflow_dispatch:

concurrency:
  group: experimental-v3-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Build pinned LGPL FFmpeg audio extension
        run: |
          sdkmanager "ndk;27.1.12297006" "cmake;3.22.1"
          chmod +x scripts/build-media3-ffmpeg-audio.sh
          ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/27.1.12297006" ./scripts/build-media3-ffmpeg-audio.sh

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Verify configured playlist and guide
        env:
          EXPO_PUBLIC_M3U_URL: ${{ secrets.M3U_URL || vars.EXPO_PUBLIC_M3U_URL }}
          EXPO_PUBLIC_EPG_URL: ${{ secrets.EPG_URL || vars.EXPO_PUBLIC_EPG_URL }}
        run: |
          test -n "${EXPO_PUBLIC_M3U_URL}"
          test -n "${EXPO_PUBLIC_EPG_URL}"

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Typecheck v3 source
        run: npm run typecheck

      - name: Build release APK
        run: ./android/gradlew -p android assembleSideload --stacktrace
        env:
          CI: '1'
          EXPO_PUBLIC_M3U_URL: ${{ secrets.M3U_URL || vars.EXPO_PUBLIC_M3U_URL }}
          EXPO_PUBLIC_EPG_URL: ${{ secrets.EPG_URL || vars.EXPO_PUBLIC_EPG_URL }}

      - name: Verify embedded React Native bundle
        run: |
          APK="android/app/build/outputs/apk/sideload/app-sideload.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -E "(index\.android\.bundle|assets/.*\.bundle|resources\.arsc)" >/dev/null

      - name: Rename APK
        run: |
          mkdir -p android/app/build/outputs/apk/tester
          cp android/app/build/outputs/apk/sideload/app-sideload.apk android/app/build/outputs/apk/tester/CharmIPTV-Experimental-v3.apk

      - name: Upload Experimental v3 APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CharmIPTV-Experimental-v3-APK
          path: frontend/android/app/build/outputs/apk/tester/CharmIPTV-Experimental-v3.apk
          if-no-files-found: error
          retention-days: 14
