name: Phase 9 EPG Fallback Ownership

on:
  push:
    branches:
      - phase9/purple-next
    paths:
      - "ci/phase9-epg-fallback-ownership.trigger"
      - "ci/phase9-epg-fallback-ownership.py"
      - ".github/workflows/phase9-epg-fallback-ownership.yml"

permissions:
  contents: write

concurrency:
  group: phase9-epg-fallback-ownership
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase9/purple-next
      - name: Apply guarded ownership repair
        run: python ci/phase9-epg-fallback-ownership.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/source.native.ts
          git commit -m "Phase 9: enforce EPG ownership in primary fallback" || exit 0
          git pull --rebase origin phase9/purple-next
          git push origin HEAD:phase9/purple-next
