name: Apply Code Interaction Settings Player Repair

on:
  push:
    branches:
      - agent/code-interaction-audit
    paths:
      - ci/code-interaction-audit-settings-player-repair.trigger
  pull_request:
    branches:
      - agent/code-interaction-audit
    paths:
      - ci/code-interaction-audit-settings-player-repair.trigger

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/code-interaction-audit
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply settings/player lifecycle repairs
        run: python3 ci/code-interaction-audit-settings-player-repair.py

      - name: Normalize player Quick Actions command bridge
        run: python3 ci/code-interaction-audit-osd-command-normalize.py

      - name: Apply single player Quick Actions ownership repair
        run: python3 ci/code-interaction-audit-osd-consolidation.py

      - name: Apply foreground refresh ownership repair
        run: python3 ci/code-interaction-audit-foreground-refresh-repair.py

      - name: Apply Guide modal preview ownership repair
        run: python3 ci/code-interaction-audit-guide-modal-repair.py

      - name: Apply inactive tab teardown repair
        run: python3 ci/code-interaction-audit-tab-lifecycle-repair.py

      - name: Apply EPG schedule RAM isolation repair
        run: python3 ci/code-interaction-audit-epg-schedule-repair.py

      - name: Normalize repeated repair ownership artifacts
        run: python3 ci/code-interaction-audit-repair-idempotence-normalize.py

      - name: Align regression tests with repaired ownership contracts
        run: python3 ci/code-interaction-audit-test-contract-repair.py

      - name: Verify repair convergence and one-owner state
        run: python3 ci/code-interaction-audit-repair-idempotence-scan.py

      - name: Run complete settings lifecycle scan
        run: python3 ci/code-interaction-audit-settings-lifecycle-scan.py

      - name: Inventory every settings configuration option
        run: python3 ci/code-interaction-audit-setting-option-inventory.py

      - name: Run EPG schedule cache lifecycle scan
        run: python3 ci/code-interaction-audit-epg-schedule-lifecycle-scan.py

      - name: Run player OSD ownership scan
        run: python3 ci/code-interaction-audit-osd-lifecycle-scan.py

      - name: Run foreground refresh ownership scan
        run: python3 ci/code-interaction-audit-foreground-refresh-scan.py

      - name: Run Guide modal preview ownership scan
        run: python3 ci/code-interaction-audit-guide-modal-lifecycle-scan.py

      - name: Run inactive tab lifecycle RAM scan
        run: python3 ci/code-interaction-audit-tab-lifecycle-scan.py

      - name: Run whole-app lifecycle scan
        run: python3 ci/code-interaction-audit-lifecycle-scan.py

      - name: Run preview/player lifecycle scan
        run: python3 ci/code-interaction-audit-preview-lifecycle-scan.py

      - name: Install JavaScript dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Unit and interaction tests
        working-directory: frontend
        run: npm test

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Validate patch shape
        run: git diff --check

      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name "charm-audit-bot"
          git config user.email "charm-audit-bot@users.noreply.github.com"
          git add frontend \
            ci/code-interaction-audit-repair-idempotence-report.txt \
            ci/code-interaction-audit-settings-lifecycle-report.txt \
            ci/code-interaction-audit-setting-option-inventory.txt \
            ci/code-interaction-audit-epg-schedule-lifecycle-report.txt \
            ci/code-interaction-audit-osd-lifecycle-report.txt \
            ci/code-interaction-audit-foreground-refresh-report.txt \
            ci/code-interaction-audit-guide-modal-lifecycle-report.txt \
            ci/code-interaction-audit-tab-lifecycle-report.txt \
            ci/code-interaction-audit-lifecycle-report.txt \
            ci/code-interaction-audit-preview-lifecycle-report.txt
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix: unify player settings Guide modal tab EPG and refresh lifecycles"
          git push origin HEAD:agent/code-interaction-audit
