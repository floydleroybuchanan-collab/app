name: Code Interaction Audit Player Stability

on:
  push:
    branches:
      - agent/phase9-tivimate-scan-repair
    paths:
      - ci/code-interaction-audit-player-stability.trigger

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/phase9-tivimate-scan-repair
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply focused player stability repair
        run: python ci/code-interaction-audit-player-stability.py
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "Charm Interaction Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/patches/expo-video+3.0.16.patch
          git commit -m "fix(player): tolerate live-stream read jitter"
          git push origin HEAD:agent/phase9-tivimate-scan-repair
