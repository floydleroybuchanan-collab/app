name: Code Interaction Audit Player Stability

on:
  push:
    branches:
      - agent/code-interaction-audit
    paths:
      - ci/code-interaction-audit-player-stability.trigger
  pull_request:
    branches:
      - agent/code-interaction-audit
    paths:
      - ci/code-interaction-audit-player-stability.trigger

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/code-interaction-audit
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply focused interaction repairs
        run: |
          python ci/code-interaction-audit-player-stability.py
          python ci/code-interaction-audit-vlc-watchdog.py
          python ci/code-interaction-audit-cleanup.py
          python ci/code-interaction-audit-player-preferences.py
          python ci/code-interaction-audit-player-ownership.py
          python ci/code-interaction-audit-media3-first-frame.py
          python ci/code-interaction-audit-guide-owner.py
          python ci/code-interaction-audit-test-contracts.py
          python ci/code-interaction-audit-preview-isolation.py
      - name: Validate patch shape
        run: git diff --check
      - name: Commit repairs
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "Charm Interaction Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/patches/expo-video+3.0.16.patch \
                  frontend/app/player.tsx \
                  frontend/app/'(tabs)'/guide.tsx \
                  frontend/src/components/StreamPlayer.tsx \
                  frontend/src/components/ProgramModal.tsx \
                  frontend/src/playerEnginePreference.ts \
                  frontend/src/core/playbackBufferProfile.ts \
                  frontend/src/core/playerCompatibilityPreferences.ts \
                  frontend/src/core/subtitlePreferences.ts \
                  frontend/src/core/audioTrackPreferences.ts \
                  frontend/src/core/remoteShortcutPreferences.ts \
                  frontend/android/app/src/main/java/com/charmiptv/app/NativeGuideView.kt \
                  frontend/android/app/src/main/java/com/charmiptv/app/MainActivity.kt \
                  frontend/src/components/PurpleGuideGroupDrawer.tsx \
                  frontend/tests/playbackSession.test.mjs \
                  frontend/tests/guideShellPolish.test.mjs \
                  frontend/tests/playerLiveStability.test.mjs
          git commit -m "fix(audit): isolate preview from fullscreen playback"
          git push origin HEAD:agent/code-interaction-audit
