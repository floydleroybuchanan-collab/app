name: Build CharmIPTV perf universal APK

# Manual + dedicated delivery branches only. Running this on every PR to main doubled hosted-runner
# demand alongside Purple TV APK and made capacity incidents cancel all checks.
on:
  workflow_dispatch:
  push:
    branches:
      - perf/opt-fix
      - agent/tivimate-deep-player-quickactions-repair
      - agent/media3-player-core-rebuild
    paths:
      - "frontend/**"
      - ".github/workflows/build-phoenix-apk.yml"

permissions:
  contents: read
  issues: write

# Keep queued/running APK jobs alive across retriggers — cancel storms left PRs red
# even when typecheck/lint would have passed.
concurrency:
  group: perf-opt-universal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: Validate and build universal Android TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: frontend
    env:
      EXPO_PUBLIC_M3U_URL: ${{ secrets.M3U_URL || vars.EXPO_PUBLIC_M3U_URL }}
      EXPO_PUBLIC_EPG_URL: ${{ secrets.EPG_URL || vars.EXPO_PUBLIC_EPG_URL }}
      EXPO_PUBLIC_GUIDE_WINDOW_HOURS: ${{ vars.EXPO_PUBLIC_GUIDE_WINDOW_HOURS || '24' }}
      CMAKE_BUILD_PARALLEL_LEVEL: "1"
      CI: "1"

    steps:
      - name: Checkout player recovery branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android native toolchain
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Build pinned LGPL FFmpeg audio extension
        run: |
          chmod +x scripts/build-media3-ffmpeg-audio.sh
          ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/27.1.12297006" ./scripts/build-media3-ffmpeg-audio.sh

      - name: Install JavaScript dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Configure deterministic low-memory build
        run: |
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.workers.max=1
          org.gradle.vfs.watch=false
          kotlin.compiler.execution.strategy=in-process
          kotlin.daemon.enabled=false
          reactNativeArchitectures=armeabi-v7a,arm64-v8a
          EOF

      - name: Build universal tester APK
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android :app:assembleSideload --no-daemon --max-workers=1 --stacktrace

      - name: Verify universal APK contents
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/sideload/app-sideload.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -Eq "(assets/index\.android\.bundle|assets/.*\.bundle)"
          unzip -l "$APK" | grep -q "lib/armeabi-v7a/"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/"
          mkdir -p artifacts
          cp "$APK" "artifacts/CharmIPTV-player-recovery-Universal-${GITHUB_RUN_NUMBER}.apk"
          sha256sum "artifacts/CharmIPTV-player-recovery-Universal-${GITHUB_RUN_NUMBER}.apk" > artifacts/SHA256SUMS.txt

      - name: Upload universal APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CharmIPTV-player-recovery-Universal-${{ github.run_number }}
          path: |
            frontend/artifacts/CharmIPTV-player-recovery-Universal-${{ github.run_number }}.apk
            frontend/artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish APK run pointer to PR 29
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/29/comments" \
            -f body="CharmIPTV sideload APK build run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} | job=${{ job.status }} | commit=${GITHUB_SHA}"
