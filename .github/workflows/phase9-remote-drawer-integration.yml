name: Phase 9 Remote Drawer Integration

on:
  push:
    branches:
      - phase9/purple-next
    paths:
      - ci/phase9-remote-drawer-integration.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase9/purple-next
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply guarded Phase 9 remote/drawer integration fixes
        run: python ci/phase9-remote-drawer-integration.py
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "Charm Phase 9 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/components/PurpleTvShell.tsx 'frontend/app/(tabs)/guide.tsx' frontend/android/app/src/main/java/com/charmiptv/app/MainActivity.kt frontend/app/player.tsx
          git commit -m "fix(phase9): centralize drawer and remote ownership"
          git push origin HEAD:phase9/purple-next
