name: Phase 9 - TiviMate player channel strip focus

on:
  push:
    branches:
      - phase9/purple-next
    paths:
      - .github/workflows/phase9-tivimate-player-channel-strip-focus.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: phase9/purple-next
          fetch-depth: 0

      - name: Focus current channel when fullscreen strip opens
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('frontend/app/player.tsx')
          s = path.read_text()

          ref_marker = '  const channelsButtonRef = useRef<any>(null);\n'
          ref_add = ref_marker + '  const firstChannelCardRef = useRef<any>(null);\n'
          if 'const firstChannelCardRef = useRef<any>(null);' not in s:
              if ref_marker not in s:
                  raise SystemExit('channels button ref marker missing')
              s = s.replace(ref_marker, ref_add, 1)

          old_history = '''  const historyChannels = useMemo(() => {\n    const seen = new Set<string>();\n    const out: Channel[] = [];\n    for (const item of recent) {\n'''
          new_history = '''  const historyChannels = useMemo(() => {\n    const seen = new Set<string>();\n    const out: Channel[] = [];\n    // Keep the currently selected channel first so opening the strip has a\n    // deterministic focus anchor instead of an arbitrary recent/provider row.\n    const selected = channelById(channelId);\n    if (selected?.url) {\n      seen.add(selected.id);\n      out.push(selected);\n    }\n    for (const item of recent) {\n'''
          if new_history not in s:
              if old_history not in s:
                  raise SystemExit('historyChannels marker missing')
              s = s.replace(old_history, new_history, 1)
          s = s.replace('  }, [recent, streamChannels]);\n', '  }, [channelById, channelId, recent, streamChannels]);\n', 1)

          effect_marker = '''  useEffect(() => {\n    channelsOpenRef.current = channelsOpen;\n  }, [channelsOpen]);\n'''
          effect_new = effect_marker + '''\n  useEffect(() => {\n    if (!channelsOpen || !isTV) return;\n    // TiviMate-style explicit ownership: opening Channels lands inside the\n    // strip on the selected channel rather than leaving focus on the opener.\n    const timer = setTimeout(() => requestNativeFocus(firstChannelCardRef.current), 40);\n    return () => clearTimeout(timer);\n  }, [channelsOpen, isTV]);\n'''
          if 'opening Channels lands inside the' not in s:
              if effect_marker not in s:
                  raise SystemExit('channelsOpen effect marker missing')
              s = s.replace(effect_marker, effect_new, 1)

          old_render = '                renderItem={({ item }) => (\n                  <Pressable\n                    onPress={() => changeChannel(item.id, true, { immediate: true })}\n'
          new_render = '                renderItem={({ item, index }) => (\n                  <Pressable\n                    ref={index === 0 ? firstChannelCardRef : undefined}\n                    onPress={() => changeChannel(item.id, true, { immediate: true })}\n'
          if new_render not in s:
              if old_render not in s:
                  raise SystemExit('channel strip render marker missing')
              s = s.replace(old_render, new_render, 1)

          path.write_text(s)

          test_path = Path('frontend/tests/playerAndFocus.test.mjs')
          t = test_path.read_text()
          name = 'fullscreen Channels strip opens on the selected channel with explicit focus'
          if name not in t:
              t += r'''

test("fullscreen Channels strip opens on the selected channel with explicit focus", async () => {
  const player = await source("app/player.tsx");
  assert.match(player, /const firstChannelCardRef = useRef<any>\(null\)/);
  assert.match(player, /const selected = channelById\(channelId\);[\s\S]{0,140}out\.push\(selected\)/);
  assert.match(player, /if \(!channelsOpen \|\| !isTV\) return;[\s\S]{0,180}requestNativeFocus\(firstChannelCardRef\.current\)/);
  assert.match(player, /renderItem=\{\(\{ item, index \}\) => \([\s\S]{0,100}ref=\{index === 0 \? firstChannelCardRef : undefined\}/);
});
'''
              test_path.write_text(t)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/player.tsx frontend/tests/playerAndFocus.test.mjs
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "phase9: focus fullscreen channel strip deterministically"
          git push origin HEAD:phase9/purple-next
