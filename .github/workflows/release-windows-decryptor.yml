name: Release Charming MediaLab Windows APK Decryptor

on:
  push:
    branches:
      - main
    paths:
      - 'tools/windows-decryptor/**'
      - '.github/workflows/release-windows-decryptor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Test, build and publish Windows EXE
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Extract Windows app source
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath 'tools/windows-decryptor/CharmingMediaLab-APK-Decryptor-Source.zip' -DestinationPath 'windows-decryptor-build' -Force

      - name: Repair Windows 11 GUI startup
        shell: pwsh
        run: |
          Copy-Item tools/windows-decryptor/startup_windows.go windows-decryptor-build/startup_windows.go
          python tools/windows-decryptor/patch-startup.py
          if ($LASTEXITCODE -ne 0) { throw 'GUI startup patch failed' }

      - name: Improve encrypted artifact ZIP detection
        shell: pwsh
        run: |
          Copy-Item tools/windows-decryptor/artifact_match.go windows-decryptor-build/artifact_match.go
          Copy-Item tools/windows-decryptor/artifact_match_test.go windows-decryptor-build/artifact_match_test.go
          $source = 'windows-decryptor-build/decrypt.go'
          $before = [System.IO.File]::ReadAllText($source)
          $after = $before.Replace('archiveItem(&outer.Reader,', 'archiveItemFlexible(&outer.Reader,')
          if ($before -eq $after) { throw 'Unable to patch artifact selection in source' }
          [System.IO.File]::WriteAllText($source, $after)

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: windows-decryptor-build/go.mod
          cache: false

      - name: Run tests and compile native Windows application
        shell: pwsh
        run: |
          Set-Location windows-decryptor-build
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go tests failed' }
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags="-H=windowsgui" -o '../CharmingMediaLab-APK-Decryptor.exe' .
          if ($LASTEXITCODE -ne 0) { throw 'Windows executable build failed' }

      - name: Launch-test actual Windows EXE
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) 'CharmingMediaLab-APK-Decryptor.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(20000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'Windows GUI startup smoke test timed out after 20 seconds'
          }
          $process.Refresh()
          Write-Host "Windows GUI smoke-test exit code: $($process.ExitCode)"
          if ($process.ExitCode -ne 0) {
            if (Test-Path 'gui-startup-smoke-error.txt') {
              Get-Content 'gui-startup-smoke-error.txt'
            }
            throw "Windows GUI startup smoke test failed (exit code $($process.ExitCode))"
          }
          Write-Host 'Windows GUI successfully launched, initialized all controls, and exited cleanly.'

      - name: Package downloadable artifacts
        shell: pwsh
        run: |
          $binary = 'CharmingMediaLab-APK-Decryptor.exe'
          $hash = (Get-FileHash -Algorithm SHA256 $binary).Hash.ToLowerInvariant()
          "$hash  $binary" | Set-Content -Encoding ascii SHA256.txt
          Copy-Item windows-decryptor-build/README.md README.md
          Compress-Archive -Path $binary, README.md, SHA256.txt -DestinationPath 'CharmingMediaLab-APK-Decryptor-Windows11.zip' -Force
          Compress-Archive -Path 'windows-decryptor-build/*' -DestinationPath 'CharmingMediaLab-APK-Decryptor-Source.zip' -Force

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'windows-decryptor-v1.0.2'
          $assets = @('CharmingMediaLab-APK-Decryptor.exe', 'CharmingMediaLab-APK-Decryptor-Windows11.zip', 'CharmingMediaLab-APK-Decryptor-Source.zip', 'SHA256.txt')
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Charming MediaLab APK Decryptor for Windows 11' --notes 'Windows 11 ZIP selection fix: recognizes protected artifacts inside nested folders, explains when the wrong ZIP was selected, includes full RSA/AES decryption and native GUI launch tests. Three PEM formats supported. No private keys included. The EXE is not publisher-signed.' --latest=false
          }
