name: Phase 9 TiviMate User Focus Wins

on:
  push:
    branches:
      - phase9/purple-next
    paths:
      - ".github/workflows/phase9-tivimate-user-focus-wins.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase9/purple-next
      - name: Disarm stale preferred focus after real focus
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'{label} marker not found')
              p.write_text(s.replace(old, new, 1))

          # Channels: first real row focus immediately owns navigation.
          replace_once(
              'frontend/app/(tabs)/channels.tsx',
              '  const favorite = useCallback((id: string) => {\n    void Haptics.selectionAsync().catch(() => undefined);\n    toggleFavorite(id);\n  }, [toggleFavorite]);\n',
              '  const favorite = useCallback((id: string) => {\n    void Haptics.selectionAsync().catch(() => undefined);\n    toggleFavorite(id);\n  }, [toggleFavorite]);\n\n  const noteChannelFocus = useCallback((id: string) => {\n    // Initial preferred focus is only an entry bootstrap. Once Android has a\n    // real focused row, user D-pad movement owns focus and must never be pulled\n    // back by a still-armed hasTVPreferredFocus flag.\n    setPreferInitialFocus(false);\n    setFocusedChannelId(id);\n  }, []);\n',
              'channels callback',
          )
          replace_once(
              'frontend/app/(tabs)/channels.tsx',
              '                onFocusChannel={setFocusedChannelId}\n',
              '                onFocusChannel={noteChannelFocus}\n',
              'channels focus prop',
          )

          # Movies/Series shared collection.
          replace_once(
              'frontend/src/components/PurpleChannelCollection.tsx',
              '  onPress,\n  preferredFocus,\n}: {\n',
              '  onPress,\n  onFocus,\n  preferredFocus,\n}: {\n',
              'collection Card args',
          )
          replace_once(
              'frontend/src/components/PurpleChannelCollection.tsx',
              '  onPress: (channel: Channel) => void;\n  preferredFocus?: boolean;\n}) {\n',
              '  onPress: (channel: Channel) => void;\n  onFocus: () => void;\n  preferredFocus?: boolean;\n}) {\n',
              'collection Card type',
          )
          replace_once(
              'frontend/src/components/PurpleChannelCollection.tsx',
              '      hasTVPreferredFocus={preferredFocus}\n      onPress={() => onPress(channel)}\n',
              '      hasTVPreferredFocus={preferredFocus}\n      onFocus={onFocus}\n      onPress={() => onPress(channel)}\n',
              'collection Pressable',
          )
          replace_once(
              'frontend/src/components/PurpleChannelCollection.tsx',
              '  const items = useMemo(() => channels.filter(matcher), [channels, matcher]);\n',
              '  const disarmInitialFocus = useCallback(() => setPreferInitialFocus(false), []);\n\n  const items = useMemo(() => channels.filter(matcher), [channels, matcher]);\n',
              'collection disarm callback',
          )
          replace_once(
              'frontend/src/components/PurpleChannelCollection.tsx',
              '                <Card channel={item} logos={isFocused && channelLogos} now={now} onPress={play} preferredFocus={preferInitialFocus && index === 0} />\n',
              '                <Card channel={item} logos={isFocused && channelLogos} now={now} onPress={play} onFocus={disarmInitialFocus} preferredFocus={preferInitialFocus && index === 0} />\n',
              'collection Card use',
          )

          # Search: keyboard/results immediately disarm entry preference.
          replace_once(
              'frontend/app/(tabs)/search.tsx',
              '  const noteKeyboardFocus = useCallback((index: number) => {\n    focusZoneRef.current = "keyboard";\n    keyboardIndexRef.current = index;\n  }, []);\n  const noteResultsFocus = useCallback(() => { focusZoneRef.current = "results"; }, []);\n',
              '  const noteKeyboardFocus = useCallback((index: number) => {\n    setPreferKeyFocus(false);\n    focusZoneRef.current = "keyboard";\n    keyboardIndexRef.current = index;\n  }, []);\n  const noteResultsFocus = useCallback(() => {\n    setPreferKeyFocus(false);\n    focusZoneRef.current = "results";\n  }, []);\n',
              'search focus callbacks',
          )

          # Settings: first actual tile/back focus disarms the bootstrap claim.
          replace_once(
              'frontend/app/(tabs)/settings.tsx',
              '                hasTVPreferredFocus={preferBackFocus}\n                onPress={() => {\n',
              '                hasTVPreferredFocus={preferBackFocus}\n                onFocus={() => setPreferBackFocus(false)}\n                onPress={() => {\n',
              'settings back focus',
          )
          replace_once(
              'frontend/app/(tabs)/settings.tsx',
              '                  hasTVPreferredFocus={preferTileFocus && index === 0}\n                  onPress={() => choose(tile.id)}\n',
              '                  hasTVPreferredFocus={preferTileFocus && index === 0}\n                  onFocus={() => setPreferTileFocus(false)}\n                  onPress={() => choose(tile.id)}\n',
              'settings tile focus',
          )

          test = Path('frontend/tests/guideShellPolish.test.mjs')
          t = test.read_text()
          case = '''\ntest("entry preferred focus disarms as soon as real user focus exists", async () => {\n  const [channels, collection, search, settings] = await Promise.all([\n    source("app/(tabs)/channels.tsx"),\n    source("src/components/PurpleChannelCollection.tsx"),\n    source("app/(tabs)/search.tsx"),\n    source("app/(tabs)/settings.tsx"),\n  ]);\n  assert.match(channels, /const noteChannelFocus = useCallback\\([\\s\\S]*?setPreferInitialFocus\\(false\\)[\\s\\S]*?setFocusedChannelId\\(id\\)/);\n  assert.match(channels, /onFocusChannel=\\{noteChannelFocus\\}/);\n  assert.match(collection, /onFocus=\\{onFocus\\}/);\n  assert.match(collection, /const disarmInitialFocus = useCallback\\(\\(\\) => setPreferInitialFocus\\(false\\)/);\n  assert.match(search, /const noteKeyboardFocus = useCallback\\([\\s\\S]*?setPreferKeyFocus\\(false\\)/);\n  assert.match(search, /const noteResultsFocus = useCallback\\([\\s\\S]*?setPreferKeyFocus\\(false\\)/);\n  assert.match(settings, /hasTVPreferredFocus=\\{preferBackFocus\\}[\\s\\S]{0,100}onFocus=\\{\\(\\) => setPreferBackFocus\\(false\\)\\}/);\n  assert.match(settings, /hasTVPreferredFocus=\\{preferTileFocus && index === 0\\}[\\s\\S]{0,100}onFocus=\\{\\(\\) => setPreferTileFocus\\(false\\)\\}/);\n});\n'''
          if 'entry preferred focus disarms as soon as real user focus exists' not in t:
              t += case
              test.write_text(t)
          PY
      - name: Commit user-focus ownership repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/'(tabs)'/channels.tsx frontend/src/components/PurpleChannelCollection.tsx frontend/app/'(tabs)'/search.tsx frontend/app/'(tabs)'/settings.tsx frontend/tests/guideShellPolish.test.mjs
          git commit -m "phase9: let user focus override entry preference"
          git push origin HEAD:phase9/purple-next
