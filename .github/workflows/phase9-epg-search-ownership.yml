name: Phase 9 EPG Search Ownership

on:
  push:
    branches:
      - phase9/purple-next
    paths:
      - "ci/phase9-epg-search-ownership.trigger"
      - "ci/phase9-epg-search-ownership.py"
      - ".github/workflows/phase9-epg-search-ownership.yml"

permissions:
  contents: write

concurrency:
  group: phase9-epg-search-ownership
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase9/purple-next
      - name: Apply guarded search ownership repair
        run: python ci/phase9-epg-search-ownership.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/android/app/src/main/java/com/charmiptv/app/EpgDatabase.kt frontend/android/app/src/main/java/com/charmiptv/app/EpgNativeModule.kt
          git commit -m "Phase 9: enforce EPG ownership in Search" || exit 0
          git pull --rebase origin phase9/purple-next
          git push origin HEAD:phase9/purple-next
