name: Apply RAM Final Cross-Check

on:
  push:
    branches:
      - experiment/full-ram-epg-engine
    paths:
      - ci/apply-ram-final-crosscheck.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: experiment/full-ram-epg-engine
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Apply unified drawer navigation refinement
        run: python ci/patch-drawer-unify.py
      - name: Commit drawer refinement
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No product changes needed"
            exit 0
          fi
          git config user.name "Charm RAM Crosscheck Bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend
          git commit -m "fix(drawer): unify navigation scroll box"
          git push origin HEAD:experiment/full-ram-epg-engine
