name: Build CharmIPTV Purple TV APK

on:
  push:
    branches:
      - main
      - experimental/purple-tv-ui
    paths:
      - 'frontend/**'
      - '.github/workflows/purple-tv-ui.yml'
  workflow_dispatch:

# Do not cancel in-progress APK builds — runner queues are long, and merge/retrigger
# events were wiping queued jobs before they ever got a runner.
concurrency:
  group: purple-tv-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release-apk:
    # Retired: Media3-only playback; kept for historical reference.
    if: ${{ false }}
    # Prefer the largest hosted pool; pin only if a package needs 24.04 specifically.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    env:
      # Prefer repository secrets (M3U_URL / EPG_URL — same as charm-refresh).
      # Optional vars.EXPO_PUBLIC_* remain as fallbacks for older Phoenix wiring.
      EXPO_PUBLIC_M3U_URL: ${{ secrets.M3U_URL || vars.EXPO_PUBLIC_M3U_URL }}
      EXPO_PUBLIC_EPG_URL: ${{ secrets.EPG_URL || vars.EXPO_PUBLIC_EPG_URL }}
      EXPO_PUBLIC_GUIDE_WINDOW_HOURS: ${{ vars.EXPO_PUBLIC_GUIDE_WINDOW_HOURS || '6' }}

    steps:
      - name: Checkout purple TV UI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require playlist and EPG build configuration
        run: |
          if [ -z "${EXPO_PUBLIC_M3U_URL}" ] || [ -z "${EXPO_PUBLIC_EPG_URL}" ]; then
            echo "::error::Missing playlist/EPG config. Set repository secrets M3U_URL and EPG_URL (Settings → Secrets and variables → Actions → Secrets), or variables EXPO_PUBLIC_M3U_URL / EXPO_PUBLIC_EPG_URL."
            exit 1
          fi
          echo "Playlist/EPG build configuration is present (values not printed)."

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Install Android native toolchain
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Build LGPL Media3 FFmpeg audio extension
        run: |
          sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1"
          chmod +x scripts/build-media3-ffmpeg-audio.sh
          ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/27.1.12297006" ./scripts/build-media3-ffmpeg-audio.sh

      - name: Install JavaScript dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build standalone tester APK
        run: ./android/gradlew -p android assembleSideload --no-daemon --stacktrace
        env:
          CI: '1'
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2'
          EXPO_PUBLIC_M3U_URL: ${{ env.EXPO_PUBLIC_M3U_URL }}
          EXPO_PUBLIC_EPG_URL: ${{ env.EXPO_PUBLIC_EPG_URL }}
          EXPO_PUBLIC_GUIDE_WINDOW_HOURS: ${{ env.EXPO_PUBLIC_GUIDE_WINDOW_HOURS }}

      - name: Verify universal APK contents
        id: app_version
        run: |
          APP_VERSION="$(node -p 'require("./app.json").expo.version')"
          test -n "$APP_VERSION"
          NOTES="../docs/TESTER_RELEASE_NOTES_${APP_VERSION}.md"
          test -f "$NOTES"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          APK="android/app/build/outputs/apk/sideload/app-sideload.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -E "(index\.android\.bundle|assets/.*\.bundle|resources\.arsc)" >/dev/null
          # FFmpeg Media3 extension must ship for AC-3/E-AC-3/DTS software decode.
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libffmpegJNI\.so' >/dev/null
          unzip -l "$APK" | grep -E 'lib/armeabi-v7a/libffmpegJNI\.so' >/dev/null
          # Default engine is VLC — fail closed if LibVLC natives are missing.
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/libvlc.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libvlc.so'
          unzip -l "$APK" | grep -Eq 'lib/armeabi-v7a/libvlcjni[^/]*\.so'
          unzip -l "$APK" | grep -Eq 'lib/arm64-v8a/libvlcjni[^/]*\.so'
          mkdir -p android/app/build/outputs/apk/tester
          cp "$APK" "android/app/build/outputs/apk/tester/CharmIPTV-Purple-TV-Universal.apk"
          sha256sum "android/app/build/outputs/apk/tester/CharmIPTV-Purple-TV-Universal.apk" > "android/app/build/outputs/apk/tester/SHA256SUMS.txt"
          printf 'source_commit=%s\nworkflow=purple-tv-ui\n' "${GITHUB_SHA}" > "android/app/build/outputs/apk/tester/BUILD_INFO.txt"
          cp "$NOTES" "android/app/build/outputs/apk/tester/TESTER_RELEASE_NOTES.md"

      - name: Upload purple TV APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CharmIPTV-Purple-TV-${{ steps.app_version.outputs.version }}-${{ github.run_number }}
          path: frontend/android/app/build/outputs/apk/tester/*
          if-no-files-found: error
          retention-days: 14
