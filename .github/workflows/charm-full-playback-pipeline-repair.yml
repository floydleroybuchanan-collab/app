                publishTracks(created.currentTracks)
              }''',
          )
          replace_once(
              mgr,
              '            main.removeCallbacks(startupTimeout)\n            main.removeCallbacks(bufferingWatchdog)\n            main.removeCallbacks(delayedRecovery)\n',
              '            main.removeCallbacks(startupTimeout)\n            main.removeCallbacks(bufferingWatchdog)\n            main.removeCallbacks(surfaceRepairCheck)\n            main.removeCallbacks(delayedRecovery)\n',
          )
          replace_once(
              mgr,
              '            main.removeCallbacks(startupTimeout)\n            main.removeCallbacks(bufferingWatchdog)\n            main.removeCallbacks(opaqueTypeConfirmation)\n            resetBufferingWatchdogState()\n            recordDiagnostic("player-error", error, created)',
              '            main.removeCallbacks(startupTimeout)\n            main.removeCallbacks(bufferingWatchdog)\n            main.removeCallbacks(surfaceRepairCheck)\n            main.removeCallbacks(opaqueTypeConfirmation)\n            resetBufferingWatchdogState()\n            recordDiagnostic("player-error", error, created)',
          )
          replace_once(
              mgr,
              '          override fun onTracksChanged(tracks: Tracks) = publishTracks(tracks)\n',
              '''          override fun onTracksChanged(tracks: Tracks) {
            publishTracks(tracks)
            if (!firstFrameRendered && tracks.isTypeSelected(C.TRACK_TYPE_VIDEO)) {
              main.removeCallbacks(surfaceRepairCheck)
              main.postDelayed(surfaceRepairCheck, SURFACE_REPAIR_DELAY_MS)
            }
          }
''',
          )

          helpers_pattern = r'''  private fun playerViewFor\(target: Owner\): PlayerView\? = when \(target\) \{.*?(?=  // Inflated, not `PlayerView\(context\)`:)'''
          helpers = '''  private fun playerViewFor(target: Owner): PlayerView? = when (target) {
            Owner.PREVIEW -> previewPlayerView
            Owner.FULLSCREEN -> fullscreenPlayerView
            Owner.NONE -> null
          }

          private fun cachePlayerView(target: Owner, value: PlayerView?) {
            when (target) {
              Owner.PREVIEW -> previewPlayerView = value
              Owner.FULLSCREEN -> fullscreenPlayerView = value
              Owner.NONE -> Unit
            }
          }

          private fun clearPlayerView(target: Owner, removeFromParent: Boolean) {
            val video = playerViewFor(target) ?: return
            try { video.player = null } catch (_: Throwable) {}
            if (removeFromParent) {
              try { (video.parent as? ViewGroup)?.removeView(video) } catch (_: Throwable) {}
            }
            cachePlayerView(target, null)
          }

          private fun findSurfaceView(root: View): SurfaceView? {
            if (root is SurfaceView) return root
            if (root !is ViewGroup) return null
            for (index in 0 until root.childCount) {
              findSurfaceView(root.getChildAt(index))?.let { return it }
            }
            return null
          }

          private fun hasUsableVideoSurface(video: PlayerView): Boolean {
            if (!video.isAttachedToWindow) return false
            val surfaceView = findSurfaceView(video) ?: return true
            return surfaceView.isAttachedToWindow && runCatching { surfaceView.holder.surface.isValid }.getOrDefault(false)
          }

          private fun ensureActiveSurfaceBound(instance: ExoPlayer, event: String): Boolean {
            val activeOwner = owner
            if (activeOwner == Owner.NONE || player !== instance) return false
            val target = when (activeOwner) {
              Owner.PREVIEW -> previewSurface
              Owner.FULLSCREEN -> fullscreenSurface
              Owner.NONE -> null
            } ?: return false
            val video = ensurePlayerViewIn(activeOwner, target)
            if (video.player === instance && video.visibility == View.VISIBLE && hasUsableVideoSurface(video)) return false
            return try {
              video.player = instance
              video.visibility = View.VISIBLE
              if (activeSource != null) instance.playWhenReady = true
              recordDiagnostic("surface-rebind:$event", lastPlaybackError, instance)
              true
            } catch (failure: Throwable) {
              Log.w(TAG, "surface rebind failed: $event", failure)
              false
            }
          }

          private fun tryRepairActiveVideoSurface(instance: ExoPlayer, event: String): Boolean {
            if (owner == Owner.NONE || player !== instance || firstFrameRendered) return false
            if (!instance.currentTracks.isTypeSelected(C.TRACK_TYPE_VIDEO)) return false
            if (surfaceRepairAttempts >= MAX_SURFACE_REPAIRS_PER_TUNE) return false
            surfaceRepairAttempts += 1
            val activeOwner = owner
            val target = when (activeOwner) {
              Owner.PREVIEW -> previewSurface
              Owner.FULLSCREEN -> fullscreenSurface
              Owner.NONE -> null
            } ?: return false
            return try {
              val old = playerViewFor(activeOwner)
              val oldSurfaceUsable = old?.let(::hasUsableVideoSurface) == true
              clearPlayerView(activeOwner, removeFromParent = true)
              val fresh = ensurePlayerViewIn(activeOwner, target)
              fresh.player = instance
              fresh.visibility = View.VISIBLE
              instance.playWhenReady = activeSource != null
              recordDiagnostic("video-surface-recreated:$event:oldValid=$oldSurfaceUsable", lastPlaybackError, instance)
              true
            } catch (failure: Throwable) {
              Log.w(TAG, "video surface recreation failed: $event", failure)
              false
            }
          }

'''
