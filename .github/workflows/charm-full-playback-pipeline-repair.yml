name: Charm full playback pipeline repair

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/charm-full-playback-pipeline-repair.yml"

permissions:
  contents: write
  actions: read

jobs:
  repair-build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      TARGET_BRANCH: claude/repo-branch-access-dxx6wf
      EXPO_PUBLIC_M3U_URL: ${{ secrets.M3U_URL || vars.EXPO_PUBLIC_M3U_URL }}
      EXPO_PUBLIC_EPG_URL: ${{ secrets.EPG_URL || vars.EXPO_PUBLIC_EPG_URL }}
      EXPO_PUBLIC_GUIDE_WINDOW_HOURS: ${{ vars.EXPO_PUBLIC_GUIDE_WINDOW_HOURS || '24' }}
      CMAKE_BUILD_PARALLEL_LEVEL: "1"
      CI: "1"
    steps:
      - name: Checkout playback branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: claude/repo-branch-access-dxx6wf
          fetch-depth: 0

      - name: Apply guarded full playback pipeline repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one literal match in {path}, found {count}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1))

          def sub_once(path, pattern, replacement, flags=0):
              text = path.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"Expected exactly one regex match in {path}, found {count}: {pattern[:140]!r}")
              path.write_text(updated)

          # ------------------------------------------------------------------
          # Media3: keep the user's deliberately generous jitter profile while
          # repairing the actual native video-surface lifecycle.
          # ------------------------------------------------------------------
          mgr = Path("frontend/android/app/src/main/java/com/charmiptv/app/NativePlaybackManager.kt")
          replace_once(mgr, "import android.view.LayoutInflater\nimport android.view.View\n", "import android.view.LayoutInflater\nimport android.view.SurfaceView\nimport android.view.View\nimport android.view.ViewGroup\n")
          for old, new in {
              "MIN_BUFFER_MS_LOW_RAM = 15_000": "MIN_BUFFER_MS_LOW_RAM = 20_000",
              "MAX_BUFFER_MS_LOW_RAM = 45_000": "MAX_BUFFER_MS_LOW_RAM = 90_000",
              "PLAYBACK_BUFFER_MS_LOW_RAM = 4_000": "PLAYBACK_BUFFER_MS_LOW_RAM = 5_000",
              "REBUFFER_BUFFER_MS_LOW_RAM = 8_000": "REBUFFER_BUFFER_MS_LOW_RAM = 12_000",
              "MIN_BUFFER_MS_NORMAL = 15_000": "MIN_BUFFER_MS_NORMAL = 20_000",
              "MAX_BUFFER_MS_NORMAL = 45_000": "MAX_BUFFER_MS_NORMAL = 90_000",
              "PLAYBACK_BUFFER_MS_NORMAL = 4_000": "PLAYBACK_BUFFER_MS_NORMAL = 5_000",
              "REBUFFER_BUFFER_MS_NORMAL = 8_000": "REBUFFER_BUFFER_MS_NORMAL = 12_000",
              "HUNG_BUFFER_REPREPARE_MS = 25_000L": "HUNG_BUFFER_REPREPARE_MS = 35_000L",
              "TRANSPORT_HUNG_BUFFER_REPREPARE_MS = 35_000L": "TRANSPORT_HUNG_BUFFER_REPREPARE_MS = 50_000L",
              "HARD_STALL_RECOVERY_MS = 45_000L": "HARD_STALL_RECOVERY_MS = 70_000L",
              "STABLE_REARM_MS = 60_000L": "STABLE_REARM_MS = 90_000L",
              "FULLSCREEN_START_TIMEOUT_MS = 45_000L": "FULLSCREEN_START_TIMEOUT_MS = 60_000L",
              "PREVIEW_START_TIMEOUT_MS = 45_000L": "PREVIEW_START_TIMEOUT_MS = 60_000L",
              "SOURCE_REFRESH_TIMEOUT_MS = 30_000L": "SOURCE_REFRESH_TIMEOUT_MS = 45_000L",
              ".connectTimeout(15, TimeUnit.SECONDS)": ".connectTimeout(20, TimeUnit.SECONDS)",
              ".readTimeout(30, TimeUnit.SECONDS)": ".readTimeout(45, TimeUnit.SECONDS)",
              ".writeTimeout(30, TimeUnit.SECONDS)": ".writeTimeout(45, TimeUnit.SECONDS)",
          }.items():
              replace_once(mgr, old, new)

          replace_once(
              mgr,
              '  private const val SOURCE_REFRESH_TIMEOUT_MS = 45_000L\n',
              '  private const val SOURCE_REFRESH_TIMEOUT_MS = 45_000L\n  private const val SURFACE_REPAIR_DELAY_MS = 1_500L\n  private const val MAX_SURFACE_REPAIRS_PER_TUNE = 1\n',
          )
          replace_once(
              mgr,
              '  private var codecError: String? = null\n',
              '  private var codecError: String? = null\n  private var surfaceRepairAttempts = 0\n',
          )

          replace_once(
              mgr,
              '  private val opaqueTypeConfirmation = Runnable {\n    val instance = player ?: return@Runnable\n    if (owner == Owner.NONE || !firstFrameRendered || opaqueRouteCacheKey == null) return@Runnable\n    if (instance.playbackState != Player.STATE_READY) return@Runnable\n    confirmSuccessfulStreamType()\n    recordDiagnostic("opaque-type-stable", lastPlaybackError, instance)\n  }\n',
              '''  private val opaqueTypeConfirmation = Runnable {
            val instance = player ?: return@Runnable
            if (owner == Owner.NONE || !firstFrameRendered || opaqueRouteCacheKey == null) return@Runnable
            if (instance.playbackState != Player.STATE_READY) return@Runnable
            confirmSuccessfulStreamType()
            recordDiagnostic("opaque-type-stable", lastPlaybackError, instance)
          }
          private val surfaceRepairCheck = Runnable {
            val instance = player ?: return@Runnable
            if (owner == Owner.NONE || player !== instance || firstFrameRendered) return@Runnable
            if (instance.playbackState != Player.STATE_READY || !instance.currentTracks.isTypeSelected(C.TRACK_TYPE_VIDEO)) return@Runnable
            tryRepairActiveVideoSurface(instance, "ready-no-first-frame")
          }
''',
          )

          surface_pattern = r'''  fun attachSurface\(surfaceOwner: Owner, surface: FrameLayout\) = runOnMain \{.*?^fun setResizeMode'''
          surface_replacement = '''  fun attachSurface(surfaceOwner: Owner, surface: FrameLayout) = runOnMain {
            when (surfaceOwner) {
              Owner.PREVIEW -> previewSurface = surface
              Owner.FULLSCREEN -> fullscreenSurface = surface
              Owner.NONE -> return@runOnMain
            }
            val video = ensurePlayerViewIn(surfaceOwner, surface)
            if (owner == surfaceOwner) {
              val instance = player
              video.player = instance
              video.visibility = if (instance != null) View.VISIBLE else View.GONE
              if (instance != null && activeSource != null) {
                instance.playWhenReady = true
                recordDiagnostic("surface-attached", lastPlaybackError, instance)
                if (!firstFrameRendered) {
                  armStartupTimeout()
                  main.removeCallbacks(surfaceRepairCheck)
                  main.postDelayed(surfaceRepairCheck, SURFACE_REPAIR_DELAY_MS)
                }
              }
            }
          }
          fun detachSurface(surfaceOwner: Owner, surface: FrameLayout) = runOnMain {
            val attached = when (surfaceOwner) {
              Owner.PREVIEW -> previewSurface
              Owner.FULLSCREEN -> fullscreenSurface
              Owner.NONE -> null
            }
            if (attached !== surface) return@runOnMain
            val instance = player
            if (owner == surfaceOwner && instance != null) {
              instance.playWhenReady = false
              main.removeCallbacks(startupTimeout)
              main.removeCallbacks(surfaceRepairCheck)
              recordDiagnostic("surface-detached", lastPlaybackError, instance)
              publishState("loading", "surface-detached")
            }
            clearPlayerView(surfaceOwner, removeFromParent = true)
            when (surfaceOwner) {
              Owner.PREVIEW -> previewSurface = null
              Owner.FULLSCREEN -> fullscreenSurface = null
              Owner.NONE -> Unit
            }
          }
          fun setResizeMode'''
          sub_once(mgr, surface_pattern, surface_replacement, re.S | re.M)

          replace_once(
              mgr,
              '    firstFrameRendered = false\n    recoveryAttempts = 0\n',
              '    firstFrameRendered = false\n    surfaceRepairAttempts = 0\n    recoveryAttempts = 0\n',
          )

          replace_once(
              mgr,
              '              Player.STATE_READY -> {\n                main.removeCallbacks(bufferingWatchdog)\n                resetBufferingWatchdogState()\n                ensureActiveSurfaceBound(created, "state-ready")\n                if (firstFrameRendered && stableSinceMs == 0L) stableSinceMs = System.currentTimeMillis()\n                publishTracks(created.currentTracks)\n              }',
              '''              Player.STATE_READY -> {
                main.removeCallbacks(bufferingWatchdog)
                resetBufferingWatchdogState()
                ensureActiveSurfaceBound(created, "state-ready")
                main.removeCallbacks(surfaceRepairCheck)
                if (!firstFrameRendered && created.currentTracks.isTypeSelected(C.TRACK_TYPE_VIDEO)) {
