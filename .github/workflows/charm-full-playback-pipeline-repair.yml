function collectStreamHeaderDirective(line: string, headers: Record<string, string>): boolean {
  const lower = line.toLowerCase();
  const store = (name: string, value: string) => {
    const clean = value.trim();
    if (clean) headers[name] = clean;
  };
  if (lower.startsWith("#extvlcopt:http-user-agent=")) {
    store("User-Agent", line.slice(line.indexOf("=") + 1));
    return true;
  }
  if (lower.startsWith("#extvlcopt:http-referrer=") || lower.startsWith("#extvlcopt:http-referer=")) {
    store("Referer", line.slice(line.indexOf("=") + 1));
    return true;
  }
  if (lower.startsWith("#extvlcopt:http-cookie=")) {
    store("Cookie", line.slice(line.indexOf("=") + 1));
    return true;
  }
  if (lower.startsWith("#exthttp:")) {
    try {
      const parsed = JSON.parse(line.slice(line.indexOf(":") + 1));
      if (parsed && typeof parsed === "object") {
        for (const [key, value] of Object.entries(parsed)) {
          const canonical = key.toLowerCase() === "user-agent"
            ? "User-Agent"
            : key.toLowerCase() === "referer" || key.toLowerCase() === "referrer"
              ? "Referer"
              : key.toLowerCase() === "cookie"
                ? "Cookie"
                : null;
          if (canonical && typeof value === "string") store(canonical, value);
        }
      }
    } catch {}
    return true;
  }
  return false;
}

function applyStreamHeaders(raw: string, headers: Record<string, string>): string {
  const entries = Object.entries(headers);
  if (!entries.length) return raw;
  const pipe = raw.indexOf("|");
  const base = (pipe >= 0 ? raw.slice(0, pipe) : raw).trim();
  const existing = pipe >= 0 ? raw.slice(pipe + 1).trim() : "";
  const encoded = entries.map(([key, value]) => `${encodeURIComponent(key)}=${encodeURIComponent(value)}`).join("&");
  return existing ? `${base}|${encoded}&${existing}` : `${base}|${encoded}`;
}
