    when {
      lower.startsWith("#extvlcopt:http-user-agent=") -> store("User-Agent", line.substringAfter('='))
      lower.startsWith("#extvlcopt:http-referrer=") || lower.startsWith("#extvlcopt:http-referer=") -> store("Referer", line.substringAfter('='))
      lower.startsWith("#extvlcopt:http-cookie=") -> store("Cookie", line.substringAfter('='))
      lower.startsWith("#exthttp:") -> runCatching {
        val json = JSONObject(line.substringAfter(':').trim())
        val iterator = json.keys()
        while (iterator.hasNext()) {
          val rawKey = iterator.next()
          val canonical = when (rawKey.lowercase(Locale.US)) {
            "user-agent" -> "User-Agent"
            "referer", "referrer" -> "Referer"
            "cookie" -> "Cookie"
            else -> null
          } ?: continue
          store(canonical, json.optString(rawKey, ""))
        }
      }
      else -> return false
    }
    return true
  }

  private fun applyStreamHeaders(raw: String, headers: Map<String, String>): String {
    if (headers.isEmpty()) return raw
    val base = raw.substringBefore('|').trim()
    val existing = raw.substringAfter('|', "").trim()
    val encoded = headers.entries.joinToString("&") { (key, value) -> "${Uri.encode(key)}=${Uri.encode(value)}" }
    return if (existing.isEmpty()) "$base|$encoded" else "$base|$encoded&$existing"
  }

