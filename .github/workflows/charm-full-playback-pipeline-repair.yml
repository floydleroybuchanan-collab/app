            playerViewFor(surfaceOwner)?.let { existing -> if (existing.parent === target) return existing }
            val video = (LayoutInflater.from(target.context).inflate(R.layout.charm_player_view, target, false) as PlayerView).apply {'''
          new_ensure = '''  private fun ensurePlayerViewIn(surfaceOwner: Owner, target: FrameLayout): PlayerView {
            playerViewFor(surfaceOwner)?.let { existing ->
              if (existing.parent === target) return existing
              try { existing.player = null } catch (_: Throwable) {}
              try { (existing.parent as? ViewGroup)?.removeView(existing) } catch (_: Throwable) {}
              cachePlayerView(surfaceOwner, null)
            }
            // Clean up any orphan PlayerView left in this React-native host by a
            // previous transient Fabric detach before creating the authoritative one.
            for (index in target.childCount - 1 downTo 0) {
              val child = target.getChildAt(index)
              if (child is PlayerView) {
                try { child.player = null } catch (_: Throwable) {}
                target.removeViewAt(index)
              }
            }
            val video = (LayoutInflater.from(target.context).inflate(R.layout.charm_player_view, target, false) as PlayerView).apply {'''
