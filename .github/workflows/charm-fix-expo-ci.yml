name: Repair Expo dependency drift

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/charm-fix-expo-ci.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install current dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Align Expo SDK patch versions
        working-directory: frontend
        run: npx expo install expo@~54.0.37 expo-constants@~18.0.14 expo-file-system@~19.0.24 --npm

      - name: Validate repaired dependency set
        working-directory: frontend
        run: |
          npm run doctor
          npm test
          npm run typecheck
          npm run lint

      - name: Commit validated dependency alignment
        run: |
          git config user.name "Charm Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes required"
            exit 0
          fi
          git commit -m "fix(ci): align Expo SDK patch dependencies"
          git push origin HEAD:main
