name: Phase 9 Guide Order All Groups

on:
  push:
    branches:
      - phase9/purple-next
    paths:
      - "ci/phase9-guide-order-all-groups.py"
      - ".github/workflows/phase9-guide-order-all-groups.yml"

permissions:
  contents: write

concurrency:
  group: phase9-guide-order-all-groups
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase9/purple-next
      - name: Apply guarded Guide ordering repair
        run: python ci/phase9-guide-order-all-groups.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/core/guideGroups.ts
          git commit -m "Phase 9: apply custom Guide order across groups" || exit 0
          git pull --rebase origin phase9/purple-next
          git push origin HEAD:phase9/purple-next
