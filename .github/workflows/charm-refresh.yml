name: Refresh Charm IPTV data

# Rebuilds channels + EPG and pushes optimized JSON to Cloudflare KV.
on:
  schedule:
    - cron: "0 */3 * * *" # every 3 hours (UTC)
  workflow_dispatch: {} # lets you run it manually from the Actions tab
  push:
    branches:
      - main
    paths:
      - "cloudflare-backend/**"
      - ".github/workflows/charm-refresh.yml"

concurrency:
  group: charm-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Allow queue wait + build; previous 10m timeout cancelled jobs before a runner arrived.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Verify required secrets
        id: secrets
        run: |
          missing=0
          for name in CF_ACCOUNT_ID CF_KV_NAMESPACE_ID CF_API_TOKEN M3U_URL EPG_URL; do
            # Values are injected below; empty means secret not configured.
            eval "val=\$$name"
            if [ -z "$val" ]; then
              echo "::warning::Missing secret/env: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare/guide secrets are not configured; skipping refresh."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          M3U_URL: ${{ secrets.M3U_URL }}
          EPG_URL: ${{ secrets.EPG_URL }}

      - name: Build data & upload to Cloudflare KV
        if: steps.secrets.outputs.ready == 'true'
        run: node cloudflare-backend/scripts/build-and-upload.mjs
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          M3U_URL: ${{ secrets.M3U_URL }}
          EPG_URL: ${{ secrets.EPG_URL }}
          GUIDE_WINDOW_HOURS: ${{ vars.GUIDE_WINDOW_HOURS || vars.EXPO_PUBLIC_GUIDE_WINDOW_HOURS || '12' }}
          APP_VERSION: "2.0.0-beta.1"
          MAINTENANCE: "false"
