name: Purple Next CI and APK

on:
  push:
    branches:
      - next/purple-production
    paths:
      - "frontend/**"
      - "docs/**"
      - ".github/workflows/purple-next-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: purple-next-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    # Retired publisher: use build-media3-sideload-now.yml with current secrets and owner encryption.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: frontend
    env:
      EXPO_PUBLIC_M3U_URL: ${{ secrets.M3U_URL || vars.EXPO_PUBLIC_M3U_URL }}
      EXPO_PUBLIC_EPG_URL: ${{ secrets.EPG_URL || vars.EXPO_PUBLIC_EPG_URL }}
      EXPO_PUBLIC_GUIDE_WINDOW_HOURS: ${{ vars.EXPO_PUBLIC_GUIDE_WINDOW_HOURS || '6' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require playlist and EPG build configuration
        run: |
          if [ -z "${EXPO_PUBLIC_M3U_URL}" ] || [ -z "${EXPO_PUBLIC_EPG_URL}" ]; then
            echo "::error::Missing playlist/EPG config. Set secrets M3U_URL and EPG_URL (or vars EXPO_PUBLIC_M3U_URL / EXPO_PUBLIC_EPG_URL)."
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Build pinned LGPL FFmpeg audio extension
        run: |
          sdkmanager "ndk;27.1.12297006" "cmake;3.22.1"
          chmod +x scripts/build-media3-ffmpeg-audio.sh
          ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/27.1.12297006" ./scripts/build-media3-ffmpeg-audio.sh
      - name: Install dependencies deterministically
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Verify checked-in Android configuration
        run: npm run verify:native-config
      - name: Validate Expo and React Native dependencies
        run: npm run doctor
      - name: Phase 1 and 2 regression tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Record Phase 1 benchmark
        run: CHARM_BENCH_CHANNELS=20000 CHARM_BENCHMARK_OUTPUT=ci/phase1-benchmark.json npm run benchmark:phase1
      - name: Run Phase 2 guide torture model
        run: CHARM_TORTURE_CHANNELS=240 CHARM_TORTURE_CYCLES=25 CHARM_TORTURE_OUTPUT=ci/phase2-guide-torture.json npm run torture:guide
      - name: Build side-by-side Purple Next APK
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android assembleSideload --no-daemon --stacktrace
        env:
          CI: "1"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2"
          EXPO_PUBLIC_M3U_URL: ${{ env.EXPO_PUBLIC_M3U_URL }}
          EXPO_PUBLIC_EPG_URL: ${{ env.EXPO_PUBLIC_EPG_URL }}
          EXPO_PUBLIC_GUIDE_WINDOW_HOURS: ${{ env.EXPO_PUBLIC_GUIDE_WINDOW_HOURS }}
      - name: Name and checksum APK
        run: |
          APK=android/app/build/outputs/apk/sideload/app-sideload.apk
          test -f "$APK"
          mkdir -p artifact/install artifact/evidence
          cp "$APK" artifact/install/CharmIPTV-Purple-Next.apk
          sha256sum artifact/install/CharmIPTV-Purple-Next.apk > artifact/evidence/CharmIPTV-Purple-Next.apk.sha256
          cp ci/phase1-benchmark.json artifact/evidence/
          cp ci/phase2-guide-torture.json artifact/evidence/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CharmIPTV-Purple-Next-APK-${{ github.sha }}
          path: frontend/artifact/install/CharmIPTV-Purple-Next.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CharmIPTV-Purple-Next-Evidence-${{ github.sha }}
          path: frontend/artifact/evidence/*
          if-no-files-found: error
          retention-days: 30
