name: Phase 9 TiviMate Remove Destructive Playlist API

on:
  push:
    branches:
      - phase9/purple-next
    paths:
      - ".github/workflows/phase9-tivimate-remove-destructive-playlist-api.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase9/purple-next
      - name: Replace legacy destructive playlist method with incremental delegate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/android/app/src/main/java/com/charmiptv/app/EpgDatabase.kt')
          s = p.read_text()
          start = s.find('  fun replacePlaylistChannels(\n')
          end = s.find('  private fun fingerprintPlaylistChannels(', start)
          if start < 0 or end < 0:
              raise SystemExit('legacy playlist method bounds not found')
          replacement = '''  @Deprecated("Use incremental PlaylistSyncCoordinator; kept only for source compatibility")\n  fun replacePlaylistChannels(\n    rows: List<PlaylistChannelRow>,\n    playlistEpoch: Long,\n    contentFingerprint: String,\n  ): Boolean = PlaylistSyncCoordinator.sync(this, rows, playlistEpoch, contentFingerprint)\n\n'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY
      - name: Commit safety guard
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/android/app/src/main/java/com/charmiptv/app/EpgDatabase.kt
          git commit -m "phase9: eliminate destructive playlist replacement path"
          git push origin HEAD:phase9/purple-next
