      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install JavaScript dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Full regression tests
        working-directory: frontend
        run: npm test

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Verify native architecture
        working-directory: frontend
        run: |
          npm run verify:native-config
          npm run verify:native-guide

      - name: Build pinned LGPL FFmpeg audio extension
        working-directory: frontend
        run: |
          chmod +x scripts/build-media3-ffmpeg-audio.sh
          ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/27.1.12297006" ./scripts/build-media3-ffmpeg-audio.sh

      - name: Configure deterministic low-memory build
        working-directory: frontend
        run: |
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.workers.max=1
          org.gradle.vfs.watch=false
          kotlin.compiler.execution.strategy=in-process
          kotlin.daemon.enabled=false
          reactNativeArchitectures=armeabi-v7a,arm64-v8a
          EOF

      - name: Build universal sideload APK
        working-directory: frontend
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android :app:assembleSideload --no-daemon --max-workers=1 --stacktrace

      - name: Verify universal APK contents
        working-directory: frontend
        run: |
          APK="android/app/build/outputs/apk/sideload/app-sideload.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -Eq "(assets/index\.android\.bundle|assets/.*\.bundle)"
          unzip -l "$APK" | grep -q "lib/armeabi-v7a/"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libffmpegJNI.so"
          unzip -l "$APK" | grep -q "lib/armeabi-v7a/libffmpegJNI.so"
          mkdir -p artifacts
          cp "$APK" "artifacts/CharmIPTV-surface-epg-fix-${GITHUB_RUN_NUMBER}.apk"
          sha256sum "artifacts/CharmIPTV-surface-epg-fix-${GITHUB_RUN_NUMBER}.apk" > artifacts/SHA256SUMS.txt

      - name: Commit validated fixes to playback branch
        shell: bash
        run: |
          git config user.name "Charm Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            frontend/android/app/src/main/java/com/charmiptv/app/NativePlaybackManager.kt \
            frontend/android/app/src/main/java/com/charmiptv/app/NativePlaybackSurface.kt \
            frontend/android/app/src/main/java/com/charmiptv/app/EpgDatabase.kt \
            frontend/android/app/src/main/java/com/charmiptv/app/EpgNativeModule.kt \
            frontend/tests
          git commit -m "fix(player): bind physical video surface and finish EPG swaps"
          git push origin HEAD:"$TARGET_BRANCH"

      - name: Upload sideload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CharmIPTV-surface-epg-fix-${{ github.run_number }}
          path: |
            frontend/artifacts/CharmIPTV-surface-epg-fix-${{ github.run_number }}.apk
            frontend/artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
