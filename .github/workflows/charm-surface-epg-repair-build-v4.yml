      return@Runnable
    }
    VideoSurfaceBindState.READY -> Unit
  }
  if (hungForMs < HARD_STALL_RECOVERY_MS) {''',
          )

          surface_pattern = r'''  fun attachSurface\(surfaceOwner: Owner, surface: FrameLayout\) = runOnMain \{.*?^fun setResizeMode'''
          surface_replacement = '''  fun attachSurface(surfaceOwner: Owner, surface: FrameLayout) = runOnMain {
    when (surfaceOwner) {
