name: Charm physical video surface and EPG repair build v4

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/charm-surface-epg-repair-build-v4.yml"

permissions:
  contents: write

jobs:
  repair-build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_BRANCH: claude/repo-branch-access-dxx6wf
      EXPO_PUBLIC_M3U_URL: ${{ secrets.M3U_URL || vars.EXPO_PUBLIC_M3U_URL }}
      EXPO_PUBLIC_EPG_URL: ${{ secrets.EPG_URL || vars.EXPO_PUBLIC_EPG_URL }}
      EXPO_PUBLIC_GUIDE_WINDOW_HOURS: ${{ vars.EXPO_PUBLIC_GUIDE_WINDOW_HOURS || '24' }}
      CMAKE_BUILD_PARALLEL_LEVEL: "1"
      CI: "1"
    steps:
      - name: Checkout playback branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: claude/repo-branch-access-dxx6wf
          fetch-depth: 0

      - name: Apply physical SurfaceView and EPG swap repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one literal match in {path}, found {count}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1))

          def sub_once(path, pattern, replacement, flags=0):
              text = path.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"Expected exactly one regex match in {path}, found {count}: {pattern[:120]!r}")
              path.write_text(updated)

          mgr = Path("frontend/android/app/src/main/java/com/charmiptv/app/NativePlaybackManager.kt")
          replace_once(mgr, "import android.view.View\n", "import android.view.View\nimport android.view.SurfaceHolder\nimport android.view.SurfaceView\n")
          replace_once(
              mgr,
              "  private data class PlaybackSource(val channelKey: String, val uri: String, val headers: Map<String, String>, val contentType: String?, val sourceType: String)\n",
              "  private data class PlaybackSource(val channelKey: String, val uri: String, val headers: Map<String, String>, val contentType: String?, val sourceType: String)\n  private enum class VideoSurfaceBindState { UNAVAILABLE, READY, REBOUND }\n",
          )
          replace_once(
              mgr,
              "  private var player: ExoPlayer? = null\n",
              "  private var player: ExoPlayer? = null\n  // PlayerView.player being non-null does not prove its SurfaceView currently owns\n  // a valid compositor surface. Track the exact output bound to the exact player.\n  private var boundVideoSurfaceView: SurfaceView? = null\n  private var boundVideoSurfacePlayer: ExoPlayer? = null\n",
          )

          startup_old = '''  private val startupTimeout = Runnable {
    val instance = player ?: return@Runnable
    if (owner == Owner.NONE || firstFrameRendered) return@Runnable
    if (ensureActiveSurfaceBound(instance, "startup-timeout")) {
      recordDiagnostic("startup-surface-rebound", lastPlaybackError, instance)
      armStartupTimeout()
      return@Runnable
    }
    recordDiagnostic("start-timeout", lastPlaybackError, instance)
    recoverOnce(instance, skipBarePrepare = activeSource?.sourceType == "transport")
  }'''
          startup_new = '''  private val startupTimeout = Runnable {
    val instance = player ?: return@Runnable
    if (owner == Owner.NONE || firstFrameRendered) return@Runnable
    when (ensureActiveSurfaceBound(instance, "startup-timeout")) {
      VideoSurfaceBindState.REBOUND -> {
        recordDiagnostic("startup-surface-rebound", lastPlaybackError, instance)
        armStartupTimeout()
        return@Runnable
      }
      VideoSurfaceBindState.UNAVAILABLE -> {
        recordDiagnostic("startup-surface-unavailable", lastPlaybackError, instance)
        finishWithError("surface-unavailable", instance)
        return@Runnable
      }
      VideoSurfaceBindState.READY -> Unit
    }
    recordDiagnostic("start-timeout", lastPlaybackError, instance)
    recoverOnce(instance, skipBarePrepare = activeSource?.sourceType == "transport")
  }'''
          replace_once(mgr, startup_old, startup_new)

          replace_once(
              mgr,
              '''  if (ensureActiveSurfaceBound(instance, "buffer-watchdog")) {
    bufferingSinceMs = nowMs
    main.postDelayed(bufferingWatchdog, observationThresholdMs)
    return@Runnable
  }
  if (hungForMs < HARD_STALL_RECOVERY_MS) {''',
              '''  when (ensureActiveSurfaceBound(instance, "buffer-watchdog")) {
    VideoSurfaceBindState.REBOUND -> {
      bufferingSinceMs = nowMs
      main.postDelayed(bufferingWatchdog, observationThresholdMs)
      return@Runnable
    }
    VideoSurfaceBindState.UNAVAILABLE -> {
