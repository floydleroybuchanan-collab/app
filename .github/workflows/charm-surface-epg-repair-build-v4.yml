    val owner = TvRemoteModule.remoteContext
    return owner == "guide" || owner == "player" || owner == "modal"
  }

  private fun yieldForInteractiveTv() {
    // WAL keeps readers on the last-good live table while staging is written.
    // Yield this background refresh thread; never discard a valid staged guide
    // merely because the user is actively watching or navigating TV.
    if (interactiveTvOwnsPriority()) Thread.yield()
  }

  fun replaceBatches''',
