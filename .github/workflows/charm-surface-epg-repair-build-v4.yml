          helper_replacement = '''  private fun playerViewFor(target: Owner): PlayerView? = when (target) {
    Owner.PREVIEW -> previewPlayerView
    Owner.FULLSCREEN -> fullscreenPlayerView
    Owner.NONE -> null
  }

  private fun surfaceTargetFor(target: Owner): FrameLayout? = when (target) {
    Owner.PREVIEW -> previewSurface
    Owner.FULLSCREEN -> fullscreenSurface
    Owner.NONE -> null
  }

  private fun videoSurfaceView(video: PlayerView?): SurfaceView? = video?.videoSurfaceView as? SurfaceView

  private fun clearBoundVideoSurface(instance: ExoPlayer, surfaceView: SurfaceView) {
    if (boundVideoSurfacePlayer !== instance || boundVideoSurfaceView !== surfaceView) return
    try { instance.clearVideoSurfaceView(surfaceView) } catch (_: Throwable) {}
    boundVideoSurfaceView = null
    boundVideoSurfacePlayer = null
  }

  private fun ensureActiveSurfaceBound(instance: ExoPlayer, event: String): VideoSurfaceBindState {
    val activeOwner = owner
    if (activeOwner == Owner.NONE || player !== instance) return VideoSurfaceBindState.UNAVAILABLE
    val target = surfaceTargetFor(activeOwner) ?: return VideoSurfaceBindState.UNAVAILABLE
    val video = ensurePlayerViewIn(activeOwner, target)
    val surfaceView = videoSurfaceView(video) ?: run {
      recordDiagnostic("surface-missing:$event", lastPlaybackError, instance)
      return VideoSurfaceBindState.UNAVAILABLE
    }
    try {
      if (video.player !== instance) video.player = instance
      video.visibility = View.VISIBLE
    } catch (failure: Throwable) {
      Log.w(TAG, "PlayerView bind failed: $event", failure)
      return VideoSurfaceBindState.UNAVAILABLE
    }
    val nativeSurface = try { surfaceView.holder.surface } catch (_: Throwable) { null }
    val usable =
      target.isAttachedToWindow &&
        video.isAttachedToWindow &&
        surfaceView.isAttachedToWindow &&
        surfaceView.width > 0 &&
        surfaceView.height > 0 &&
        nativeSurface?.isValid == true
    if (!usable) {
      recordDiagnostic("surface-wait:$event", lastPlaybackError, instance)
      return VideoSurfaceBindState.UNAVAILABLE
    }
    if (boundVideoSurfacePlayer === instance && boundVideoSurfaceView === surfaceView) {
      return VideoSurfaceBindState.READY
    }
    return try {
      // Bind the physical video output, not merely PlayerView.player. Media3 then
      // tracks this SurfaceView's holder lifecycle and cannot keep decoding audio
      // forever into a dead/stale video target.
      instance.setVideoSurfaceView(surfaceView)
      boundVideoSurfaceView = surfaceView
      boundVideoSurfacePlayer = instance
      if (activeSource != null) instance.playWhenReady = true
      recordDiagnostic("surface-output-bound:$event", lastPlaybackError, instance)
      VideoSurfaceBindState.REBOUND
    } catch (failure: Throwable) {
      Log.w(TAG, "SurfaceView output bind failed: $event", failure)
      VideoSurfaceBindState.UNAVAILABLE
    }
  }

  private fun onVideoSurfaceAvailable(surfaceOwner: Owner, video: PlayerView, surfaceView: SurfaceView, event: String) = runOnMain {
    if (owner != surfaceOwner || playerViewFor(surfaceOwner) !== video || videoSurfaceView(video) !== surfaceView) return@runOnMain
    val instance = player ?: return@runOnMain
    val state = ensureActiveSurfaceBound(instance, event)
    if (state != VideoSurfaceBindState.UNAVAILABLE && activeSource != null) {
      instance.playWhenReady = true
      if (!firstFrameRendered) armStartupTimeout()
    }
  }

  private fun onVideoSurfaceDestroyed(surfaceOwner: Owner, video: PlayerView, surfaceView: SurfaceView) = runOnMain {
    if (playerViewFor(surfaceOwner) !== video || videoSurfaceView(video) !== surfaceView) return@runOnMain
    val instance = player
    if (instance != null) clearBoundVideoSurface(instance, surfaceView)
    if (owner == surfaceOwner && instance != null) {
      instance.playWhenReady = false
      firstFrameRendered = false
      main.removeCallbacks(startupTimeout)
      main.removeCallbacks(bufferingWatchdog)
      resetBufferingWatchdogState()
      recordDiagnostic("surface-destroyed", lastPlaybackError, instance)
      publishState("loading", "surface-detached")
    }
  }

  // Inflated'''
