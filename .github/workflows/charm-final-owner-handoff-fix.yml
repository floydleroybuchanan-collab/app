name: Apply guarded Media3 owner handoff fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/charm-final-owner-handoff-fix.yml"
      - "frontend/android/app/src/main/java/com/charmiptv/app/NativePlaybackManager.kt"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Validate TiViMate owner handoff contract
        shell: bash
        run: |
          set -euo pipefail
          mgr=frontend/android/app/src/main/java/com/charmiptv/app/NativePlaybackManager.kt
          grep -q 'fun prepare(requestedOwner: Owner' "$mgr"
          grep -q 'clearInactivePlayerView(requestedOwner)' "$mgr"
          grep -q 'fun tivimateBufferDurationsMs' "$mgr"
          grep -q 'RECONNECT_STALL_MS = 50_000L' "$mgr"
          grep -q 'START_TIMEOUT_MS = 60_000L' "$mgr"
          grep -q 'connectTimeout(20, TimeUnit.SECONDS)' "$mgr"
          grep -q 'readTimeout(0, TimeUnit.SECONDS)' frontend/android/app/src/main/java/com/charmiptv/app/CharmHttpClients.kt
          ! grep -q 'HARD_STALL_RECOVERY_MS\|HUNG_BUFFER_REPREPARE_MS\|STABLE_REARM_MS\|stableSinceMs\|MIN_BUFFER_MS_LOW_RAM' "$mgr"
          python3 - <<'PY'
          from pathlib import Path
          text = Path("frontend/android/app/src/main/java/com/charmiptv/app/NativePlaybackManager.kt").read_text()
          start = text.find("fun prepare(requestedOwner: Owner")
          end = text.find("fun provideFreshSource", start)
          prepare = text[start:end] if start >= 0 and end > start else ""
          bind = prepare.find("video.player = instance")
          clear = prepare.find("clearInactivePlayerView(requestedOwner)")
          if bind < 0 or clear < 0 or bind > clear:
              raise SystemExit("replacement PlayerView must be bound before clearInactivePlayerView()")
          print("TiViMate owner handoff contract OK")
          PY
