name: Phase 9 TiviMate Inactive Guide Query Silence

on:
  push:
    branches:
      - phase9/purple-next
    paths:
      - ".github/workflows/phase9-tivimate-guide-inactive-query-silence.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase9/purple-next
      - name: Keep inactive Guide reads from emitting focus
        run: |
          python - <<'PY'
          from pathlib import Path

          native = Path('frontend/android/app/src/main/java/com/charmiptv/app/NativeGuideView.kt')
          s = native.read_text()
          old = '''            // Data arrival may update the selected programme payload, but only\n            // key-up/focus ownership may declare navigation settled.\n            emitSelection(false)'''
          new = '''            // Data arrival may update the selected programme payload, but only\n            // key-up/focus ownership may declare navigation settled. If a drawer,\n            // modal, or route owns focus, repaint the cache silently instead of\n            // sending a late Guide selection back across the React bridge.\n            if (enabled) emitSelection(false)'''
          if 'if (enabled) emitSelection(false)' not in s:
              if old not in s:
                  raise SystemExit('query selection marker not found')
              s = s.replace(old, new, 1)
          native.write_text(s)

          test = Path('frontend/tests/guideShellPolish.test.mjs')
          t = test.read_text()
          case = '''\ntest("inactive native Guide query completion cannot reclaim JS focus", async () => {\n  const native = await source("android/app/src/main/java/com/charmiptv/app/NativeGuideView.kt");\n  assert.match(native, /If a drawer,[\\s\\S]{0,180}if \\(enabled\\) emitSelection\\(false\\)/);\n  assert.doesNotMatch(native, /key-up\\/focus ownership may declare navigation settled\\.\\s*emitSelection\\(false\\)/);\n});\n'''
          if 'inactive native Guide query completion cannot reclaim JS focus' not in t:
              t += case
              test.write_text(t)
          PY
      - name: Commit inactive Guide query silence
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/android/app/src/main/java/com/charmiptv/app/NativeGuideView.kt frontend/tests/guideShellPolish.test.mjs
          git commit -m "phase9: silence inactive guide query selection"
          git push origin HEAD:phase9/purple-next
