name: Code Interaction Audit Player Freeze

on:
  push:
    branches:
      - agent/code-interaction-audit
    paths:
      - ci/code-interaction-audit-player-freeze.trigger
  pull_request:
    branches:
      - agent/code-interaction-audit
    paths:
      - ci/code-interaction-audit-player-freeze.trigger

permissions:
  contents: write

jobs:
  repair-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/code-interaction-audit
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply player freeze and decoder ownership repair
        run: python ci/code-interaction-audit-player-freeze-repair.py

      - name: Repo-wide player decoder codec bleed scan
        run: python ci/code-interaction-audit-player-freeze-scan.py

      - name: Existing preview/fullscreen lifecycle scan
        run: python ci/code-interaction-audit-preview-lifecycle-scan.py

      - name: Whole-app RAM cache lifecycle scan
        run: python ci/code-interaction-audit-lifecycle-scan.py

      - name: EPG schedule isolation scan
        run: python ci/code-interaction-audit-epg-schedule-lifecycle-scan.py

      - name: Guide modal ownership scan
        run: python ci/code-interaction-audit-guide-modal-lifecycle-scan.py

      - name: Install JavaScript dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Unit and interaction tests
        working-directory: frontend
        run: npm test

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Validate patch shape
        run: git diff --check

      - name: Commit verified repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "Charm Interaction Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            frontend/src/components/StreamPlayer.tsx \
            frontend/app/player.tsx \
            ci/code-interaction-audit-player-freeze-report.txt
          git commit -m "fix(player): prevent nested recovery and frozen decoder bleed"
          git push origin HEAD:agent/code-interaction-audit
