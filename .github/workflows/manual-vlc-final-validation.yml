name: Manual VLC Final Validation

on:
  push:
    branches:
      - agent/manual-vlc-engine
    paths:
      - ".github/workflows/manual-vlc-final-validation.yml"
      - "frontend/**"
      - "ci/tivimate-whole-repo-player-interaction-scan.py"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: manual-vlc-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests scan native compile no APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Publish live run id
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$GITHUB_RUN_ID" > .github/manual-vlc-current-run.txt
          git add .github/manual-vlc-current-run.txt
          git commit -m "ci: record manual VLC validation run ${GITHUB_RUN_ID}" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Post live run pointer
        continue-on-error: true
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/31/comments" \
            -f body="Manual VLC FINAL VALIDATION STARTED | commit=${GITHUB_SHA} | run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android SDK and pinned NDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Verify native config and guide
        run: |
          npm run verify:native-config
          npm run verify:native-guide

      - name: Unit and wiring tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Whole repository player interaction scan
        working-directory: .
        run: python3 ci/tivimate-whole-repo-player-interaction-scan.py

      - name: Verify locked player values and opaque routing
        working-directory: .
        run: |
          PLAYER=frontend/android/app/src/main/java/com/charmiptv/app/NativePlaybackManager.kt
          grep -q 'OPAQUE_LIVE_CANDIDATES = listOf("transport", "hls", "dash", "progressive")' "$PLAYER"
          grep -q 'probeReason = "direct:transport"' "$PLAYER"
          ! grep -q 'NativeOpaqueStreamProbe.start' "$PLAYER"
          grep -q 'OPAQUE_TYPE_PREFS = "charm_media3_stream_types"' "$PLAYER"
          grep -q 'main.postDelayed(opaqueTypeConfirmation, OPAQUE_CONFIRM_MS)' "$PLAYER"
          grep -q 'fun tivimateBufferDurationsMs' "$PLAYER"
          grep -q 'else -> intArrayOf(10_000, 30_000, 2_500, 5_000)' "$PLAYER"
          grep -q 'RECONNECT_STALL_MS = 15_000L' "$PLAYER"
          ! grep -q 'HUNG_BUFFER_REPREPARE_MS\|TRANSPORT_HUNG_BUFFER_REPREPARE_MS\|HARD_STALL_RECOVERY_MS\|STABLE_REARM_MS\|MIN_BUFFER_MS_LOW_RAM\|MIN_BUFFER_MS_NORMAL' "$PLAYER"
          grep -q 'readTimeout(0, TimeUnit.SECONDS)' "$PLAYER"
          grep -q 'MAX_AUTO_RECOVERIES = 4' "$PLAYER"
          grep -q 'longArrayOf(0L, 1_000L, 3_000L, 6_000L)' "$PLAYER"

      - name: Compile native Kotlin and Java only
        env:
          CI: "1"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=1"
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android \
            :ffmpeg-audio:compileDebugJavaWithJavac \
            :app:compileDebugKotlin \
            :app:compileDebugJavaWithJavac \
            --no-daemon --max-workers=1 --stacktrace

      - name: Confirm validation produced no APK
        run: test ! -d android/app/build/outputs/apk

      - name: Post final success
        if: success()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/31/comments" \
            -f body="Manual VLC FINAL VALIDATION PASSED | commit=${GITHUB_SHA} | run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} | tests/typecheck/lint/scan/native compile=PASS | APK=NOT_BUILT"

      - name: Post final failure
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/31/comments" \
            -f body="Manual VLC FINAL VALIDATION FAILED | commit=${GITHUB_SHA} | run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} | inspect failing job before APK build"
