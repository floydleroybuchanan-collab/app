name: Cancel active sideload build

on:
  push:
    branches: [main]
    paths: [".github/workflows/cancel-active-apk-build.yml"]

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel requested APK workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/floydleroybuchanan-collab/app/actions/runs/32837816988/cancel
